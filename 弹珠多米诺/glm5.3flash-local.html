<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RUBE·LAB 鲁布·戈德堡机械 — 全物理验收版</title>
<style>
  :root {
    --bg: #12151c; --panel: #191e29; --panel2: #202634; --line: #2a3140;
    --ink: #e8ecf4; --mut: #8b94a7; --accent: #6ea8fe;
    --ok: #7bd88f; --warn: #ffd479; --err: #ff7b72;
    --action: #7fb3ff; --contact: #ffd479; --state: #9be29b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column;
  }
  header { padding: 10px 16px 8px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0 0 8px; font-size: 17px; font-weight: 650; letter-spacing: .5px; }
  header h1 .sub { margin-left: 10px; font-size: 12px; font-weight: 400; color: var(--mut); }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
  .row .lbl { color: var(--mut); font-size: 12px; margin-right: 2px; }
  button {
    background: var(--panel2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 7px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: #3d4763; }
  button.on { background: #24406e; border-color: var(--accent); color: #cfe2ff; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: #24406e; border-color: #3d5f9e; }
  main {
    flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 420px; gap: 10px; padding: 10px;
  }
  #stage { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  #cv { display: block; width: 100%; aspect-ratio: 1600 / 820; }
  #hud {
    position: absolute; top: 10px; left: 12px; display: flex; gap: 14px; flex-wrap: wrap;
    font-size: 12px; color: var(--mut); background: rgba(18,21,28,.55); padding: 5px 10px; border-radius: 8px;
    backdrop-filter: blur(3px); pointer-events: none;
  }
  #hud b { color: var(--ink); font-weight: 600; }
  #hud .bad { color: var(--err); }
  aside { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  section.panel h2 { margin: 0 0 8px; font-size: 13px; color: var(--mut); font-weight: 600; letter-spacing: .5px; }
  #chainPanel { flex: none; }
  #chainGrid { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    border: 1px solid var(--line); border-radius: 7px; padding: 3px 8px; font-size: 12px; color: var(--mut);
    background: var(--panel2); white-space: nowrap;
  }
  .chip.hit { color: #d5e3ff; border-color: #33518a; background: #1d2c49; }
  .chip .t { color: var(--accent); margin-left: 5px; font-variant-numeric: tabular-nums; }
  #chainVerdict { margin-top: 8px; font-size: 12px; color: var(--mut); }
  #chainVerdict.ok { color: var(--ok); } #chainVerdict.bad { color: var(--err); }
  #logPanel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #log {
    flex: 1; min-height: 0; overflow-y: auto; font-size: 12px; line-height: 1.45;
    font-variant-numeric: tabular-nums;
  }
  .ev { padding: 3px 6px; border-left: 2px solid var(--line); margin-bottom: 3px; }
  .ev .meta { color: var(--mut); }
  .ev.ACTION { border-left-color: var(--action); }
  .ev.CONTACT { border-left-color: var(--contact); }
  .ev.STATE { border-left-color: var(--state); }
  .ev .lab { font-weight: 600; }
  .ev.ACTION .lab { color: var(--action); }
  .ev.CONTACT .lab { color: var(--contact); }
  .ev.STATE .lab { color: var(--state); }
  .ev .evd { color: var(--mut); display: block; }
  #checks { max-height: 260px; overflow-y: auto; font-size: 12.5px; }
  #checks .ck { padding: 2px 0; }
  #checks .ck.pass::before { content: "✓ "; color: var(--ok); }
  #checks .ck.fail::before { content: "✗ "; color: var(--err); }
  #checks .ck .d { color: var(--mut); font-size: 11.5px; }
  #checks .final { margin-top: 6px; font-weight: 650; }
  #checks .final.ok { color: var(--ok); } #checks .final.bad { color: var(--err); }
  @media (max-width: 1100px) {
    main { grid-template-columns: 1fr; }
    #logPanel { min-height: 300px; }
  }
</style>
</head>
<body>
<header>
  <h1>RUBE·LAB 鲁布·戈德堡机械<span class="sub">Matter.js 全物理链条 · 零定时器 · 与 test/headless.js 同一构建与推进循环</span></h1>
  <div class="row" id="scenarioRow"><span class="lbl">场景</span></div>
  <div class="row" id="ctrlRow">
    <span class="lbl">操作</span>
    <button id="btnPause">⏸ 暂停</button>
    <button id="btnRelease">释放弹珠</button>
    <button id="btnArmLock">布防·锁块</button>
    <button id="btnArmBaffle">布防·挡板</button>
    <button id="btnArmGravity">布防·半重</button>
    <button id="btnReset">↺ 重置</button>
    <span class="lbl" style="margin-left:10px">速度</span>
    <button class="spd" data-s="0.5">0.5×</button>
    <button class="spd on" data-s="1">1×</button>
    <button class="spd" data-s="2">2×</button>
    <button class="spd" data-s="4">4×</button>
    <button id="btnAccept" class="primary" style="margin-left:10px">▶ 复跑全套验收</button>
  </div>
</header>
<main>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud">
      <span>步 <b id="hStep">0</b></span>
      <span>t <b id="hT">0.00s</b></span>
      <span>g <b id="hG">1.00</b></span>
      <span>跷板 <b id="hPlank">—</b></span>
      <span>状态 <b id="hStat">运行中</b></span>
      <span>事件 <b id="hEv">0</b></span>
      <span>跳因果 <b id="hNC">0</b></span>
    </div>
  </div>
  <aside>
    <section class="panel" id="chainPanel">
      <h2>因果链时序（9 环）</h2>
      <div id="chainGrid"></div>
      <div id="chainVerdict">—</div>
    </section>
    <section class="panel" id="logPanel">
      <h2>事件流（碰撞配对 / 刚体状态 / 操作动作）</h2>
      <div id="log"></div>
    </section>
    <section class="panel" id="checkPanel" style="display:none">
      <h2>验收结果（同 test/headless.js 的 30 项）</h2>
      <div id="checks"></div>
    </section>
  </aside>
</main>

    backstop:  { x: 1420, y: 722, w: 8, h: 14 },              // 小车后挡墩（顶722与锤头底718留4px；拦轮+接多米诺）
    // 弹珠与释放销
    ballR: 12, ballStartS: 30,                  // 沿坡距坡顶
    // 跷跷板（angle 0 摆放，开机后自沉降到 ~+2.1°）
    plankMain: { x: 750, y: 550, w: 520, h: 12 },
lipL:      { x: 540, y: 534, w: 6, h: 20 },     // 左杯唇20px（高度上限：沉降+2.05°后顶右角(544.3,516.6)距h-5%下降航迹球底仅2.1px，再高必擦球；−8.2°时爬越需抬球心18.3px→球速≥3.19，实测到达2.7-3.0兜住）
lipR:      { x: 604, y: 534, w: 6, h: 20 },     // 右杯唇20px（左移至604：缩短球甩头后向左唇的滚程67→55px降低爬唇速度；顶仍高出球心7px截停右滚）
    finger:    { x: 1017, y: 623, w: 6, h: 134 },   // 闸门吊板（挡小车鼻）
    bolt:      { x: 982, y: 524, w: 44, h: 40 },    // 黄铜配重（刚性并小板右端；质心在主板右缘内侧）
    // 小车（车身预转 9.18° 与坡平行；轮与车身同组不互撞）
    cartBody: { x: 990.8, y: 677.8, w: 44, h: 20 },
    cartAngle: 0.1603,                          // atan2(50,310)
    wheelFL:  { x: 979.3, y: 686.1, r: 8 },
    wheelFR:  { x: 999.1, y: 689.3, r: 8 },
    // 多米诺
    dominoW: 12, dominoH: 46, dominoY: 736,
    dominoX0: 1250, dominoStep: 26, dominoN: 6,
    // 铜锤与铜铃
    hammerAxle: { x: 1430, y: 681 },
    hammerRod:  { x: 1430, y: 696, w: 6, h: 30 },
    hammerHead: { x: 1430, y: 711, r: 7 },
    bell:       { x: 1456, y: 710, r: 13 },
    // 木牌（纯视觉，不参与物理）
    sign: { base: { x: 1532, y: 731, w: 68, h: 10 },
            post: { x: 1532, y: 681, w: 8, h: 90 },
            card: { x: 1532, y: 666, w: 84, h: 44 } }
  };

  // 沿斜坡取点（用于弹珠初始摆放，heightPct ∈ [-5,+5]）
  function rampPoint(s) {
    var a = L.ramp.pts[0], b = L.ramp.pts[1];
    var dx = b[0] - a[0], dy = b[1] - a[1], len = Math.sqrt(dx * dx + dy * dy);
    var t = s / len;
    return { x: a[0] + dx * t, y: a[1] + dy * t, ux: dx / len, uy: dy / len,
             nx: dy / len, ny: -dx / len }; // n 指向坡面上方
  }

  RL.rampPoint = rampPoint;

  function rect(x, y, w, h, opts) { return B.rectangle(x, y, w, h, opts); }
  // 多边形质心（面积加权），保证 fromVertices 落位准确
  function polyCentroid(vs) {
    var A = 0, cx = 0, cy = 0;
    for (var i = 0; i < vs.length; i++) {
      var j = (i + 1) % vs.length;
      var cr = vs[i].x * vs[j].y - vs[j].x * vs[i].y;
      A += cr; cx += (vs[i].x + vs[j].x) * cr; cy += (vs[i].y + vs[j].y) * cr;
    }
    A /= 2;
    return { x: cx / (6 * A), y: cy / (6 * A) };
  }
  function poly(pts, opts) {
    var vs = pts.map(function (p) { return { x: p[0], y: p[1] }; });
    var c = polyCentroid(vs);
    return B.fromVertices(c.x, c.y, [vs], opts, true);
  }

  // opts: { heightPct: -5..+5, gravity: 1 }
  function build(engine, opts) {
    opts = opts || {};
    var heightPct = (opts.heightPct || 0);
    var world = engine.world;
    engine.gravity.y = (opts.gravity === undefined ? 1 : opts.gravity);
    engine.enableSleeping = false;
    engine.positionIterations = 10;
    engine.velocityIterations = 8;
    engine.constraintIterations = 4;

    var st = { label: 'terrain', friction: 0.5, restitution: 0.05, isStatic: true };

    // —— 静态地形 ——
    var leftDeck = rect(L.leftDeck.x + L.leftDeck.w / 2, L.leftDeck.y + L.leftDeck.h / 2,
                        L.leftDeck.w, L.leftDeck.h, st);
    var pitFloor = rect(L.pitFloor.x + L.pitFloor.w / 2, L.pitFloor.y + L.pitFloor.h / 2,
                        L.pitFloor.w, L.pitFloor.h, st);
    var slopeDeck = poly(L.slopeDeck.pts, st);
    var flatDeck = rect(L.flatDeck.x + L.flatDeck.w / 2, L.flatDeck.y + L.flatDeck.h / 2,
                        L.flatDeck.w, L.flatDeck.h, st);
    var ramp = poly(L.ramp.pts, { label: 'ramp', friction: 0.02, restitution: 0.02, isStatic: true });
    var leg1 = rect(L.rampLeg1.x, L.rampLeg1.y + L.rampLeg1.h / 2, L.rampLeg1.w, L.rampLeg1.h, st);
    var leg2 = rect(L.rampLeg2.x, L.rampLeg2.y + L.rampLeg2.h / 2, L.rampLeg2.w, L.rampLeg2.h, st);
    var wedge = poly(L.wedge.pts, { label: 'wedge', friction: 0.6, isStatic: true });
    var stopBlock = poly(L.stopBlock.pts, { label: 'stopBlock', friction: 0.4, isStatic: true });
    var creepHook = poly(L.creepHook.pts, { label: 'creepHook', friction: 0.5, isStatic: true });
    var backstop = rect(L.backstop.x + L.backstop.w / 2, L.backstop.y + L.backstop.h / 2,
                        L.backstop.w, L.backstop.h, { label: 'backstop', friction: 0.5, isStatic: true });
    var wallL = rect(4, L.H / 2, 8, L.H, st);
    var wallR = rect(L.W - 4, L.H / 2, 8, L.H, st);
    var bell = B.circle(L.bell.x, L.bell.y, L.bell.r,
                        { label: 'bell', isStatic: true, friction: 0.2, restitution: 0.4 });

    // 释放销（静态圆，释放时移除）
    var s0 = L.ballStartS + heightPct * 2.0;   // ±5% ≈ ±10px 沿坡（总落差153px的±5%≈7.65px竖直≈10px沿坡）
    var rp = rampPoint(s0);
    var ballStart = { x: rp.x + L.ballR * rp.nx, y: rp.y + L.ballR * rp.ny };
    var pin = B.circle(rp.x + (L.ballR + 5 + 2) * rp.ux, rp.y + (L.ballR + 5 + 2) * rp.uy, 5,
                       { label: 'pin', isStatic: true });

    // —— 跷跷板（复合刚体：主板 + 左右杯唇 + 闸门吊板）——
    var plankMain = rect(L.plankMain.x, L.plankMain.y, L.plankMain.w, L.plankMain.h,
                         { label: 'plank', density: 0.0008, friction: 0.4, restitution: 0.02 });
    var lipL = rect(L.lipL.x, L.lipL.y, L.lipL.w, L.lipL.h,
                    { label: 'lip', density: 0.0008, friction: 0.3 });
    var lipR = rect(L.lipR.x, L.lipR.y, L.lipR.w, L.lipR.h,
                    { label: 'lip', density: 0.0008, friction: 0.3 });
    var finger = rect(L.finger.x, L.finger.y, L.finger.w, L.finger.h,
                      { label: 'finger', density: 0.0003, friction: 0.2 });
    // 黄铜配重（刚性并小跷板右端：随跷板整体起伏，不会自行翻落）
    var bolt = rect(L.bolt.x, L.bolt.y, L.bolt.w, L.bolt.h,
                    { label: 'bolt', density: 0.0006, friction: 0.5,
                      restitution: 0.02, chamfer: { radius: 3 } });

    var plank = Body.create({
      parts: [plankMain, lipL, lipR, finger, bolt],
      label: 'plank', friction: 0.4, restitution: 0.02, frictionAir: 0.0008
    });

    // —— 弹珠 ——
    var ball = B.circle(ballStart.x, ballStart.y, L.ballR,
                        { label: 'ball', density: 0.008, friction: 0.05,
                          restitution: 0.05, frictionAir: 0.0005 });

    // —— 小车（车身 + 两个独立轮，销约束；同组碰撞过滤避免轮与车身互撞）——
    var cartGroup = Body.nextGroup(true);
    var cartBody = rect(L.cartBody.x, L.cartBody.y, L.cartBody.w, L.cartBody.h,
                        { label: 'cartBody', density: 0.002, friction: 0.02,
                          restitution: 0.02, chamfer: { radius: 2 },
                          frictionAir: 0.001,
                          collisionFilter: { group: cartGroup } });
    Body.setAngle(cartBody, L.cartAngle);
    var mkWheel = function (p) {
      // 24边形近似圆：B.circle(r=8)只生成10边多边形，底弦4.9px+双点摩擦力偶把轮刹死
      // （ω≡0，整车以μ_eff≈tan9.18°恒速滑行，永远到不了CART_MOVING阈值0.29/步）；
      // 24边弦仅2.1px，接近真圆可正常滚动
      return B.polygon(p.x, p.y, 60, p.r, { label: 'wheel', density: 0.0008,
        friction: 0.9, frictionStatic: 1.2, restitution: 0.05, frictionAir: 0.001,
        collisionFilter: { group: cartGroup } });
    };
    var wheelL = mkWheel(L.wheelFL), wheelR = mkWheel(L.wheelFR);
    var axleL = Constraint.create({ bodyA: cartBody, pointA: { x: -10, y: 10 },
      bodyB: wheelL, stiffness: 1, length: 0, label: 'axleL' });
    var axleR = Constraint.create({ bodyA: cartBody, pointA: { x: 10, y: 10 },
      bodyB: wheelR, stiffness: 1, length: 0, label: 'axleR' });

    // —— 多米诺 ×6 ——
    var dominoes = [];
    for (var i = 0; i < L.dominoN; i++) {
      var dx = L.dominoX0 + i * L.dominoStep;
      dominoes.push(rect(dx + L.dominoW / 2, L.dominoY - L.dominoH / 2, L.dominoW, L.dominoH,
        // d1 加重(×8)是链传导的必要项：车须借 d1 的动量压垮拱形锁死，窗口极窄
        // (0.004/0.006 在 g=0.5 失速；车 0.0025 反而炸链)，摩擦 0.15 配合双 g 传导
        { label: 'domino' + (i + 1), density: i === 0 ? 0.008 : 0.001, friction: 0.15, restitution: 0.02,
          frictionAir: 0.0008, chamfer: { radius: 1 } }));
    }

    // —— 回击锤（摆锤，销约束悬于 axle）——
    var rod = rect(L.hammerRod.x, L.hammerRod.y, L.hammerRod.w, L.hammerRod.h,
                   { label: 'hammerRod', density: 0.002 });
    var head = B.circle(L.hammerHead.x, L.hammerHead.y, L.hammerHead.r,
                        { label: 'hammerHead', density: 0.002 });
    var hammer = Body.create({ parts: [rod, head], label: 'hammer',
                               frictionAir: 0.0002, restitution: 0.3 });
    // 轴销挂在杆顶端：pointB = 轴心在锤体局部坐标的偏移（避免把质心钉在轴上）
    var axleB = { x: L.hammerAxle.x - hammer.position.x, y: L.hammerAxle.y - hammer.position.y };
    var axle = Constraint.create({
      pointA: { x: L.hammerAxle.x, y: L.hammerAxle.y },
      bodyB: hammer, pointB: axleB, stiffness: 1, length: 0, damping: 0.02,
      label: 'hammerAxle'
    });

    Composite.add(world, [
      leftDeck, pitFloor, slopeDeck, flatDeck, ramp, leg1, leg2, wedge,
      stopBlock, creepHook, backstop, wallL, wallR, bell, pin,
      plank, ball, cartBody, wheelL, wheelR, axleL, axleR,
      hammer, axle
    ].concat(dominoes));

    return {
      layout: L,
      handles: {
        leftDeck: leftDeck, pitFloor: pitFloor, slopeDeck: slopeDeck, flatDeck: flatDeck,
        ramp: ramp, leg1: leg1, leg2: leg2, wedge: wedge, stopBlock: stopBlock,
        creepHook: creepHook,
        backstop: backstop, wallL: wallL, wallR: wallR, bell: bell, pin: pin,
        plank: plank, plankMain: plankMain, finger: finger, bolt: bolt,
        ball: ball, ballStart: ballStart, ballS0: s0,
        cartBody: cartBody, wheelL: wheelL, wheelR: wheelR,
        dominoes: dominoes, hammer: hammer
      },
      interventions: {}   // baffle / lockBlock 在此动态插入
    };
  }

  RL.World = { build: build };
  if (typeof module !== 'undefined' && module.exports) module.exports = RL.World;
})(typeof window !== 'undefined' ? window : globalThis);</script>
<script>/* events.js — 事件日志：所有条目必须携带真实证据（collisionStart 配对、刚体状态量、操作动作）。
 * 禁止把“标签变量切换”当作接触证据 —— STATE 类条目必须写明刚体角度/位移等物理量。
 */
(function (root) {
  'use strict';
  var RL = root.RL = root.RL || {};

  // 链条阶段（用于“无因果事件”诊断）
  var STAGES = ['弹珠', '跷跷板', '闸门', '小车', '多米诺', '铜锤', '铜铃', '木牌'];

  function EventLog() {
    this.entries = [];
    this._sub = [];
    this._seq = 0;
    this._maxStage = -1;
    this.noCausalCount = 0;
    this.bellStruck = false;      // 木牌翻面仅由首次 BELL_STRUCK 触发
    this.stageReached = -1;
  }
  EventLog.prototype.STAGES = STAGES;

  EventLog.prototype.on = function (fn) { this._sub.push(fn); };
  EventLog.prototype._emit = function (e) {
    for (var i = 0; i < this._sub.length; i++) this._sub[i](e);
  };

  // type: 'ACTION' | 'CONTACT' | 'STATE'
  // evidence: 人类可读的证据串（碰撞配对 / 角度 / 位移 / 速度）
  EventLog.prototype.add = function (o) {
    var e = {
      i: ++this._seq,
      tSim: o.tSim,                    // 仿真累计毫秒（非墙钟）
      type: o.type || 'STATE',
      stage: o.stage,                  // STAGES 下标
      label: o.label,
      evidence: o.evidence || '',
      latencyMs: o.latencyMs           // 仅 BELL_STRUCK：碰撞→发声调度延迟
    };
    this.entries.push(e);
    if (e.label === 'BELL_STRUCK') this.bellStruck = true;   // 木牌翻面的唯一触发源
    if (typeof e.stage === 'number') {
      if (e.stage > this.stageReached) this.stageReached = e.stage;
      // 无因果诊断：事件跳阶段（例如没开闸小车却动了）
      if (e.stage > this._maxStage + 1 && e.type !== 'ACTION') {
        e.noCausal = true;
        this.noCausalCount++;
      }
      if (e.stage > this._maxStage) this._maxStage = e.stage;
    }
    this._emit(e);
    return e;
  };

  EventLog.prototype.reset = function () {
    this.entries = [];
    this._seq = 0; this._maxStage = -1;
    this.noCausalCount = 0; this.bellStruck = false; this.stageReached = -1;
  };

  RL.EventLog = EventLog;
})(typeof window !== 'undefined' ? window : globalThis);</script>
<script>/* sensors.js — 逐步（per-physics-step）传感器与干预装置。
 * 原则：一切链式事件只在本模块读取 Matter 引擎的真实碰撞/状态后产生；
 *       干预一律在“标记节点”（几何窗口）执行，操作员无需卡秒点；
 *       若窗口已错过 → 记录 missed 且不插手。
 */
(function (root) {
  'use strict';
  var RL = root.RL = root.RL || {};
  var M = root.Matter;
  var Bodies = M.Bodies, Body = M.Body, Composite = M.Composite, Events = M.Events;

  var TERRAIN = { ramp: 1, wedge: 1, stopBlock: 1, backstop: 1, wallL: 1, wallR: 1,
                  leftDeck: 1, pitFloor: 1, slopeDeck: 1, flatDeck: 1, leg1: 1, leg2: 1,
                  pin: 1 };

  function create(ctx) {
    var engine = ctx.engine, H = ctx.handles, log = ctx.log, L = H.layout || RL.LAYOUT;
    var st = {
      released: false, restAngle: null, restFingerBottom: null,
      stageReached: -1, done: false
    };
    var pendingPairs = [];
    var cartHist = [];                   // cartBody.x 历史（小车起步持续运动窗口）
    var latch = {};                      // 每类一次性事件的去重表

    Events.on(engine, 'collisionStart', function (ev) {
      for (var i = 0; i < ev.pairs.length; i++) pendingPairs.push(ev.pairs[i]);
    });

    function latched(key) { if (latch[key]) return true; latch[key] = true; return false; }
    function simT() { return engine.timing.timestamp; }

    function add(type, stage, label, evidence, extra) {
      var o = { tSim: simT(), type: type, stage: stage, label: label, evidence: evidence };
      if (extra) for (var k in extra) o[k] = extra[k];
      return log.add(o);
    }

    // ---------- 静态插入物 ----------
    function undersideMaxY(xs) {
      // 板底在 x∈xs 窗口内的真实最低点：对 plankMain 多边形的每条边做窗口裁剪。
      // 不能只查顶点——矩形四角都在窗口外（x≈490/1010），顶点采样会漏成 -1e9，
      // 插出贯穿全屏的高墙（球被弹进坑、跷板被挤翻的真实事故）。
      var v = H.plankMain.vertices, yMax = -1e9;
      for (var i = 0; i < v.length; i++) {
        var a = v[i], b = v[(i + 1) % v.length];
        var lo = Math.min(a.x, b.x), hi = Math.max(a.x, b.x);
        if (hi < xs[0] || lo > xs[1]) continue;
        var pts = [];
        if (a.x >= xs[0] && a.x <= xs[1]) pts.push([a.x, a.y]);
        if (b.x >= xs[0] && b.x <= xs[1]) pts.push([b.x, b.y]);
        if (a.x !== b.x) {
          for (var w = 0; w < 2; w++) {
            if (xs[w] > lo && xs[w] < hi) {
              var t = (xs[w] - a.x) / (b.x - a.x);
              pts.push([xs[w], a.y + t * (b.y - a.y)]);
            }
          }
        }
        for (var j = 0; j < pts.length; j++) if (pts[j][1] > yMax) yMax = pts[j][1];
      }
      return yMax;
    }
    function insertLockBlock() {
      // 从跷板真实几何取左臂下面高度。顶面 = 板底 - 0.4px（预压）而非 +0.5px 悬空：
      // 悬空时球落板冲击先把左臂绕支点（力臂 196px）自由甩下、再砸上块沿，
      // 右臂会被翘起 ~6.7px 使小车脱扣。预压后板自插入起就架在块沿上。
      // 块右沿取 580 而非 594：球落点 x≈554.6，支点在 594 时冲击力臂 39px、
      // 翘起 1.7px 仍会扫开鼻部接触（车蠕移 6.2px 达阈值）；580 时力臂 25px、
      // 翘起 ~1.1px，鼻部几乎立即重新贴上，蠕移 <2px。窗口与 stopBlock(468..518) 不相交。
      var yMax = undersideMaxY([556, 580]);
      if (yMax === -1e9) yMax = 550;       // 兜底：窗口与板完全错开（不应发生）
      var top = yMax - 0.4, h = Math.max(10, 760 - top);
      var block = Bodies.rectangle(568, top + h / 2, 24, h,
        { label: 'lockBlock', isStatic: true, friction: 0.4 });
      Composite.add(engine.world, block);
      ctx.interventions.lockBlock = block;
      return block;
    }
    function insertBaffle() {
      var x = 1148;
      var deckY = 686 + (x - 930) * (736 - 686) / (1240 - 930);
      var h = 36;
      var baffle = Bodies.rectangle(x, deckY - h / 2, 8, h,
        { label: 'baffle', isStatic: true, friction: 0.4 });
      Composite.add(engine.world, baffle);
      ctx.interventions.baffle = baffle;
      return baffle;
    }

    // ---------- 释放（动作节点 N1，重力干预在此一并生效） ----------
    function release() {
      if (st.released) return false;
      st.released = true;
      Composite.remove(engine.world, H.pin);
      st.restAngle = H.plank.angle;
      st.restFingerBottom = H.finger.bounds.max.y;
      add('ACTION', 0, 'BALL_RELEASED',
        '移除释放销（物理动作），球位于 x=' + H.ball.position.x.toFixed(0));
      var g = iv.gravity;
      if (g.state === 'armed') {          // 重力减半：在释放节点执行
        engine.gravity.y = 0.5;
        g.state = 'executed';
        add('ACTION', 0, 'GRAVITY_HALF_APPLIED',
          '在释放节点执行：engine.gravity.y 1 → 0.5（弹珠起飞前生效）');
      } else if (g.state === 'idle') {
        add('ACTION', 0, 'GRAVITY_HALF_NOT_ARMED', '未布防，重力保持 1.0');
      }
      return true;
    }

    // ---------- 干预登记 ----------
    var iv = {
      lock: {
        name: 'lock', label: '锁死跷跷板', state: 'idle',
        enter: function () {
          var b = H.ball;
          return st.released && b.position.x > 380 && b.position.x < 505 && b.position.y < 478;
        },
        exit: function () { return H.ball.position.x > 515; },
        exec: function () {
          insertLockBlock();
          add('ACTION', 1, 'LOCK_INSERTED',

    var c = this.ensure();
    if (!c) return { latencyMs: null, skipped: 'no-audio' };
    if (c.state === 'suspended') return { latencyMs: null, skipped: 'suspended' };

      { f: 2153, g: 0.4, d: 0.9 }, { f: 2637, g: 0.25, d: 0.7 },

<script>
'use strict';

  ['CART_MOVING', '小车'], ['CART_HIT_DOMINO1', '多米诺'], ['DOMINO6_TOPPLED', '六号倒'],
  ['DOMINO_HIT_HAMMER', '铜锤'], ['BELL_STRUCK', '铜铃'], ['SIGN_FLIPPED', '木牌']

const SCENARIOS = {
  base:    { name: '基线',       opts: {}, script: { maxSteps: 1800 } },
  lock:    { name: '锁死跷跷板', opts: {}, script: { arms: { lock: 75 },   maxSteps: 600 } },
  baffle:  { name: '小车前挡板', opts: {}, script: { arms: { baffle: 90 }, maxSteps: 720 } },
  gravity: { name: '重力减半',   opts: {}, script: { arms: { gravity: 50 }, maxSteps: 1800 } },
  low:     { name: '高度−5%',   opts: { heightPct: -5 }, script: { maxSteps: 1800 } },
  high:    { name: '高度+5%',   opts: { heightPct: +5 }, script: { maxSteps: 1800 } },
  manual:  { name: '自由操作',   opts: {}, script: { maxSteps: 7200, releaseStep: 1e9 } }

// ---------- 画布 ----------
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
cv.width = 1600 * dpr; cv.height = 820 * dpr;

const COL = {
  leftDeck: '#39404f', pitFloor: '#343b49', slopeDeck: '#39404f', flatDeck: '#39404f',
  wallL: '#2e3440', wallR: '#2e3440', leg1: '#4a5265', leg2: '#4a5265',
  ramp: '#5b667a', wedge: '#23283a', stopBlock: '#7c5a49', creepHook: '#6d5147',
  backstop: '#7c5a49', plank: '#c99a5b', lip: '#a97e3f', finger: '#8fb3d9',
  bolt: '#d9b64a', pin: '#ff7b72', cartBody: '#c25b52', wheel: '#242a38',
  domino: '#efe7d3', hammerRod: '#8a6a48', hammerHead: '#c98a4b',

function colorOf(label) {

  g.beginPath(); g.moveTo(vs[0].x, vs[0].y);

      g.lineWidth = 2;

        if (p.label === 'ball') {

    g.strokeStyle = 'rgba(212,175,55,' + (0.7 * (1 - p)).toFixed(3) + ')';
    g.lineWidth = 2;
    g.beginPath(); g.arc(H.bell.position.x, H.bell.position.y, 13 + 30 * p, 0, Math.PI * 2); g.stroke();
  }
}

function drawSign() {
  const S = RL.LAYOUT.sign;
  // 底座与立柱
  g.fillStyle = '#6d5147';
  g.fillRect(S.base.x - S.base.w / 2, S.base.y - S.base.h / 2, S.base.w, S.base.h);
  g.fillRect(S.post.x - S.post.w / 2, S.post.y - S.post.h / 2, S.post.w, S.post.h);
  // 卡片：绕立柱竖轴翻面（宽度按 |cos| 收缩，按面切换文案）
  let a = 0;
  if (sim && sim.flipAt) {
    const p = Math.min((performance.now() - sim.flipAt) / 450, 1);
    const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;   // easeInOut
    a = e * Math.PI;
  }
  const w = Math.abs(Math.cos(a)), front = Math.cos(a) >= 0;
  g.save();
  g.translate(S.card.x, S.card.y);
  g.scale(Math.max(w, 0.04), 1);
  g.fillStyle = '#f5f2ea';
  g.fillRect(-S.card.w / 2, -S.card.h / 2, S.card.w, S.card.h);
  g.strokeStyle = '#b9b2a0'; g.lineWidth = 1.5;
  g.strokeRect(-S.card.w / 2, -S.card.h / 2, S.card.w, S.card.h);
  g.fillStyle = front ? '#3f9d5f' : '#c25b52';
  g.font = '600 16px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(front ? '营业中' : '已下班', 0, 1);
  g.restore();
}

// ---------- 仿真（与 headless.run() 逐步同构） ----------
function freshSim(key) {
  const sc = SCENARIOS[key];
  const engine = M.Engine.create();
  const built = RL.World.build(engine, sc.opts);
  const log = new RL.EventLog();
  const bell = new RL.Bell();
  const sensors = RL.Sensors.create({
    engine: engine, handles: built.handles, log: log, interventions: built.interventions,
    onBellStrike: function (e) {              // 铃声只由真实 collisionStart 触发
      const r = bell.ring(1);
      if (r && r.latencyMs != null) e.latencyMs = r.latencyMs;
      sim && sim.bellFlash.push(performance.now());
    }
  });
  log.on(onLogEntry);
  sim = {
    key: key, engine: engine, built: built, log: log, sensors: sensors, bell: bell,
    script: sc.script, steps: 0, released: false,
    arms: Object.assign({}, sc.script.arms || {}),
    releaseStep: (sc.script.releaseStep === undefined) ? 60 : sc.script.releaseStep,
    maxSteps: sc.script.maxSteps || 1800,
    running: true, done: false, trail: [], bellFlash: [], flipAt: 0
  };
  bell.resume();
  document.getElementById('log').textContent = '';
  buildChainGrid();
  hideChecks();
}

function stepOnce() {
  const s = sim;
  s.steps++;
  M.Engine.update(s.engine, STEP);
  s.sensors.tick();
  for (const k in s.arms) if (s.arms[k] === s.steps) s.sensors.arm(k);
  if (!s.released && s.steps >= s.releaseStep) { s.sensors.release(); s.released = true; }
  const b = s.built.handles.ball;
  s.trail.push({ x: b.position.x, y: b.position.y });
  if (s.trail.length > 36) s.trail.shift();
  const es = s.log.entries, last = es[es.length - 1];
  if ((last && last.label === 'SIGN_FLIPPED') || s.steps >= s.maxSteps) {
    s.done = true; s.running = false;
    updateStatus();
  }
}

// ---------- 事件流 / 链条 / HUD ----------
function onLogEntry(e) {
  // 只有可见仿真的 log 挂了订阅；验收引擎的 log 不订阅，故不会刷屏
  const box = document.getElementById('log');
  const div = document.createElement('div');
  div.className = 'ev ' + e.type;
  const t = (e.tSim / 1000).toFixed(2);
  let html = '<span class="meta">#' + e.i + ' t=' + t + 's </span><span class="lab">' + e.label + '</span>';
  if (e.latencyMs != null) html += '<span class="meta"> 发声延迟 ' + e.latencyMs.toFixed(1) + 'ms</span>';
  if (e.evidence) html += '<span class="evd">' + e.evidence + '</span>';
  div.innerHTML = html;
  box.appendChild(div);
  while (box.childNodes.length > 300) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
  if (e.label === 'SIGN_FLIPPED' && sim) sim.flipAt = performance.now();
}

function firstTime(log, label) {
  for (const e of log.entries) if (e.label === label) return e.tSim;
  return null;
}
function buildChainGrid() {
  const grid = document.getElementById('chainGrid');
  grid.textContent = '';
  for (const [k, name] of CHAIN) {
    const c = document.createElement('span');
    c.className = 'chip'; c.id = 'chip_' + k; c.textContent = name;
    grid.appendChild(c);
  }
}
function hideChecks() { document.getElementById('checkPanel').style.display = 'none'; }
function updateChain() {
  const order = [];
  let ordered = true, prev = -1;
  for (const [k, name] of CHAIN) {
    const t = firstTime(sim.log, k);
    const el = document.getElementById('chip_' + k);
    if (t == null) { el.className = 'chip'; el.textContent = name; continue; }
    el.className = 'chip hit';
    el.innerHTML = name + '<span class="t">' + (t / 1000).toFixed(2) + 's</span>';
    order.push(k);
    if (t < prev) ordered = false;
    prev = t;
  }
  const v = document.getElementById('chainVerdict');
  const nc = sim.log.noCausalCount;
  v.className = ordered && nc === 0 ? 'ok' : 'bad';
  v.textContent = (sim.done && firstTime(sim.log, 'SIGN_FLIPPED') != null ? '链条完成 · ' : '进行中 · ') +
    (ordered ? '因果序 ✓' : '因果序 ✗') + ' · 跳因果 ' + nc;
}
function updateStatus() {
  const el = document.getElementById('hStat');
  if (!sim.done) { el.textContent = '运行中'; el.className = ''; return; }
  const ok = firstTime(sim.log, 'SIGN_FLIPPED') != null;
  el.textContent = ok ? '完成 @ ' + (sim.steps * STEP / 1000).toFixed(2) + 's' : '未完成（' + sim.steps + ' 步上限）';
  el.className = ok ? '' : 'bad';
}
function updateHUD() {
  if (!sim) return;
  document.getElementById('hStep').textContent = sim.steps;
  document.getElementById('hT').textContent = (sim.steps * STEP / 1000).toFixed(2) + 's';
  document.getElementById('hG').textContent = sim.engine.gravity.y.toFixed(2);
  document.getElementById('hPlank').textContent = (sim.built.handles.plank.angle * 180 / Math.PI).toFixed(2) + '°';
  document.getElementById('hEv').textContent = sim.log.entries.length;
  const nc = sim.log.noCausalCount;
  const nce = document.getElementById('hNC');
  nce.textContent = nc; nce.className = nc ? 'bad' : '';
  updateChain(); updateStatus();
  // 手动操作按钮状态
  const iv = sim.sensors.iv;
  for (const name of ['lock', 'baffle', 'gravity']) {
    const b = document.getElementById('btnArm' + name[0].toUpperCase() + name.slice(1));
    const st = iv[name].state;
    b.textContent = { idle: '布防·' + (name === 'lock' ? '锁块' : name === 'baffle' ? '挡板' : '半重'),
                      armed: '已布防', executed: '已执行', missed: '已错过' }[st];
    b.classList.toggle('on', st !== 'idle');
    b.disabled = !sim.running || st !== 'idle' && st !== 'armed';
  }
  document.getElementById('btnRelease').disabled = !sim.running || sim.sensors.state.released;
  document.getElementById('btnPause').textContent = sim.running ? '⏸ 暂停' : '▶ 继续';
}

// ---------- 主循环（定步长累加器） ----------
// rAF 在后台标签页 / 未聚焦窗口会被宿主暂停，停跳 250ms 后由定时器接管
// 同一累加器，保证链条在任何环境都能走完（节流时变慢，因果序不变）。
let speed = 1, acc = 0, lastFrame = performance.now();
let lastTick = lastFrame, lastRafTick = lastFrame;
function pump(dt) {
  if (sim && sim.running && !sim.done) {
    acc += dt * speed;
    let n = 0;
    while (acc >= STEP && n < 8) { stepOnce(); acc -= STEP; n++; }
    if (n === 8) acc = 0;
  } else acc = 0;
}
function frame(now) {
  lastRafTick = now;
  pump(Math.min(now - lastFrame, 100)); lastFrame = now;
  draw(); updateHUD();
  requestAnimationFrame(frame);
}
setInterval(() => {
  const now = performance.now();
  if (now - lastRafTick < 250) return;      // rAF 活着，不重复驱动
  pump(Math.min(now - lastTick, 100)); lastTick = now;
  draw(); updateHUD();
}, 1000 / 60);

// ---------- 验收（在浏览器内复跑 test/headless.js 的全部 30 项检查） ----------
let failures = [];
function check(name, cond, detail) {
  const ok = !!cond;
  if (!ok) failures.push(name + (detail ? ' — ' + detail : ''));
  return { name: name, ok: ok, detail: detail || '' };
}
function freshR(opts) {
  const engine = M.Engine.create();
  const built = RL.World.build(engine, opts || {});
  const log = new RL.EventLog();
  const sensors = RL.Sensors.create({ engine: engine, handles: built.handles, log: log, interventions: built.interventions });
  return { engine: engine, built: built, log: log, sensors: sensors };
}
function has(log, label) { return firstTime(log, label) !== null; }
function seq(log) { return log.entries.map(e => e.label).join(','); }
function runAcc(opts, script) {
  script = script || {};
  const r = freshR(opts);
  const stepsMax = script.maxSteps || 60 * 30;
  const arms = script.arms || {};
  const releaseStep = script.releaseStep === undefined ? 60 : script.releaseStep;
  const H = r.built.handles;
  let steps = 0, released = false, landX = null;
  while (steps < stepsMax) {
    steps++;
    M.Engine.update(r.engine, STEP);
    r.sensors.tick();
    for (const k in arms) if (arms[k] === steps) r.sensors.arm(k);
    if (!released && steps >= releaseStep) { r.sensors.release(); released = true; }
    if (!landX && has(r.log, 'BALL_HIT_SEESAW')) landX = H.ball.position.x.toFixed(1);
    const es = r.log.entries, last = es[es.length - 1];
    if (last && last.label === 'SIGN_FLIPPED') break;
  }
  r.steps = steps;
  r.completed = has(r.log, 'SIGN_FLIPPED');
  r.summary = r.sensors.summary();
  r.landX = landX;
  return r;
}
function chain(r) {
  return {
    ball: firstTime(r.log, 'BALL_HIT_SEESAW'), tilt: firstTime(r.log, 'SEESAW_TILTED'),
    gate: firstTime(r.log, 'GATE_OPEN'), cart: firstTime(r.log, 'CART_MOVING'),
    dom1: firstTime(r.log, 'CART_HIT_DOMINO1'), dom6: firstTime(r.log, 'DOMINO6_TOPPLED'),
    hamm: firstTime(r.log, 'DOMINO_HIT_HAMMER'), bell: firstTime(r.log, 'BELL_STRUCK'),
    sign: firstTime(r.log, 'SIGN_FLIPPED')
  };
}
function chainOrdered(c) {
  const ks = ['ball', 'tilt', 'gate', 'cart', 'dom1', 'dom6', 'hamm', 'bell', 'sign'];
  for (let i = 1; i < ks.length; i++)
    if (c[ks[i]] == null || c[ks[i - 1]] == null || c[ks[i]] < c[ks[i - 1]]) return false;
  return true;
}
function bellCount(r) { return r.log.entries.filter(e => e.label === 'BELL_STRUCK').length; }

function runAcceptance() {
  failures = [];
  const out = [];
  const push = (...a) => out.push(...a);
  const base1 = runAcc({});
  push(check('基线一：木牌翻面（链条完成）', base1.completed));
  push(check('基线一：事件链按因果顺序', chainOrdered(chain(base1)), JSON.stringify(chain(base1))));
  push(check('基线一：无“跳因果”事件', base1.log.noCausalCount === 0, 'count=' + base1.log.noCausalCount));
  push(check('基线一：铃被真实敲响', bellCount(base1) >= 1));
  const base2 = runAcc({});
  const c1 = chain(base1), c2 = chain(base2);
  push(check('基线二：同样完成', base2.completed));
  push(check('基线二：事件序列与基线一一致（确定性）', seq(base1.log) === seq(base2.log)));
  push(check('基线二：关键事件时间偏差 < 200ms', c1.bell != null && c2.bell != null &&
    Math.abs(c1.bell - c2.bell) < 200, 'bell: ' + c1.bell + ' vs ' + c2.bell));
  const lk = runAcc({}, { arms: { lock: 75 }, maxSteps: 60 * 10 });
  push(check('锁定：弹珠撞到跷板（被接住）', has(lk.log, 'BALL_HIT_SEESAW')));
  push(check('锁定：跷跷板未倾斜(>1.5°)', !has(lk.log, 'SEESAW_TILTED')));
  push(check('锁定：闸门未打开', !has(lk.log, 'GATE_OPEN')));
  push(check('锁定：小车未动', !has(lk.log, 'CART_MOVING')));
  push(check('锁定：多米诺全未倒', !has(lk.log, 'DOMINO1_TOPPLED')));
  push(check('锁定：铃未被敲', !has(lk.log, 'BELL_STRUCK')));
  push(check('锁定：限位块已插入', lk.log.entries.some(e => e.label === 'LOCK_INSERTED')));
  push(check('锁定：终态球速 < 0.05px/ms', lk.summary.ballRest && lk.summary.ballRest.speed < 0.05));
  push(check('锁定：无跳因果事件', lk.log.noCausalCount === 0));
  const bf = runAcc({}, { arms: { baffle: 90 }, maxSteps: 60 * 12 });
  push(check('挡板：闸门已打开', has(bf.log, 'GATE_OPEN')));
  push(check('挡板：小车已起步', has(bf.log, 'CART_MOVING')));
  push(check('挡板：小车撞上挡板被截停', has(bf.log, 'CART_HIT_BAFFLE')));
  push(check('挡板：多米诺全未倒', !has(bf.log, 'DOMINO1_TOPPLED')));
  push(check('挡板：锤未摆、铃未响', !has(bf.log, 'DOMINO_HIT_HAMMER') && !has(bf.log, 'BELL_STRUCK')));
  push(check('挡板：无跳因果事件', bf.log.noCausalCount === 0));
  const gh = runAcc({}, { arms: { gravity: 50 } });
  const cg = chain(gh);
  push(check('半重：链条完成（铃响牌翻）', gh.completed));
  push(check('半重：事件链按因果顺序', chainOrdered(cg)));
  push(check('半重：无跳因果事件', gh.log.noCausalCount === 0));
  const ratioBall = cg.ball && BASE.ball ? cg.ball / BASE.ball : null;
  const ratioBell = cg.bell && BASE.bell ? cg.bell / BASE.bell : null;
  push(check('半重：节奏真实变慢（球-跷板时间比 ∈[1.15,1.9]）',
    ratioBall !== null && ratioBall > 1.15 && ratioBall < 1.9, 'ratio=' + ratioBall));
  push(check('半重：终点时间比 ∈[1.1,2.0]',
    ratioBell !== null && ratioBell > 1.1 && ratioBell < 2.0, 'ratio=' + ratioBell));
  const hLow = runAcc({ heightPct: -5 });
  push(check('高度-5%：链条完成', hLow.completed));
  const hHigh = runAcc({ heightPct: +5 });
  push(check('高度+5%：链条完成', hHigh.completed));
  push(check('高度±5%：均无跳因果事件', hLow.log.noCausalCount === 0 && hHigh.log.noCausalCount === 0));

  const box = document.getElementById('checks');
  box.textContent = '';
  for (const c of out) {
    const d = document.createElement('div');
    d.className = 'ck ' + (c.ok ? 'pass' : 'fail');
    d.textContent = c.name + (c.detail ? '  ' : '');
    if (c.detail) { const s = document.createElement('span'); s.className = 'd'; s.textContent = ' [' + c.detail + ']'; d.appendChild(s); }
    box.appendChild(d);
  }
  const f = document.createElement('div');
  f.className = 'final ' + (failures.length === 0 ? 'ok' : 'bad');
  f.textContent = failures.length === 0 ? '全部通过 ✅' : '失败 ' + failures.length + ' 项 ❌';
  box.appendChild(f);
  document.getElementById('checkPanel').style.display = '';
}
let BASE = null;   // 基线链条，供半重 ratio 用

// ---------- UI 接线 ----------
const rowS = document.getElementById('scenarioRow');
for (const key in SCENARIOS) {
  const b = document.createElement('button');
  b.textContent = SCENARIOS[key].name; b.dataset.key = key;
  b.addEventListener('click', () => {
    rowS.querySelectorAll('button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    startScenario(key);
  });
  rowS.appendChild(b);
}
function startScenario(key) {
  freshSim(key);
  if (key === 'gravity') { /* 基线比例取自验收内的基线（若已跑过） */ }
  document.getElementById('btnPause').textContent = '⏸ 暂停';
}
document.querySelectorAll('.spd').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.spd').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); speed = parseFloat(b.dataset.s);
}));
document.getElementById('btnPause').addEventListener('click', () => { if (sim) sim.running = !sim.running; });
document.getElementById('btnReset').addEventListener('click', () => {
  const cur = rowS.querySelector('button.on');
  startScenario(cur ? cur.dataset.key : 'base');
});
document.getElementById('btnRelease').addEventListener('click', () => {
  if (sim && !sim.sensors.state.released) { sim.sensors.release(); sim.released = true; sim.bell.resume(); }
});
document.getElementById('btnArmLock').addEventListener('click', () => { sim && sim.sensors.arm('lock'); });
document.getElementById('btnArmBaffle').addEventListener('click', () => { sim && sim.sensors.arm('baffle'); });
document.getElementById('btnArmGravity').addEventListener('click', () => { sim && sim.sensors.arm('gravity'); });
document.getElementById('btnAccept').addEventListener('click', function () {
  this.disabled = true; this.textContent = '验收运行中…';
  setTimeout(() => {
    BASE = chain(runAcc({}));          // 验收用基线（含比例基准）
    runAcceptance();
    this.disabled = false; this.textContent = '▶ 复跑全套验收';
  }, 30);
});

// ---------- 启动 ----------
rowS.querySelector('button[data-key="base"]').classList.add('on');
startScenario('base');
requestAnimationFrame(frame);
</script>
</body>
