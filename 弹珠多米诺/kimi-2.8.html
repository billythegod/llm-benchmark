<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一颗弹珠，让整间实验室下班 · 机械连锁装置</title>
<style>
  :root {
    --bg: #10141c;
    --panel: #171d29;
    --panel2: #1c2432;
    --line: #2a3446;
    --ink: #d8e0ee;
    --dim: #8a96ab;
    --accent: #e8b64c;
    --accent2: #e05252;
    --ok: #5fbf77;
    --warn: #e0a052;
    --bad: #e05252;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* ---------- top bar ---------- */
  #topbar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  #topbar h1 { font-size: 15px; font-weight: 600; letter-spacing: .5px; white-space: nowrap; }
  #topbar h1 .sub { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 8px; }
  #stages { display: flex; gap: 4px; flex-wrap: wrap; }
  .chip {
    padding: 2px 9px; border-radius: 999px; font-size: 12px;
    background: var(--panel2); border: 1px solid var(--line); color: var(--dim);
    transition: all .25s;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #20180a; font-weight: 600; }
  .chip.done { color: var(--ok); border-color: #2f5b3c; }
  #stats { margin-left: auto; display: flex; gap: 14px; font-size: 12px; color: var(--dim); flex-wrap: wrap; }
  #stats b { color: var(--ink); font-weight: 600; }
  #stats .bad b { color: var(--bad); }

  /* ---------- main ---------- */
  #main { flex: 1; display: flex; min-height: 0; }
  #canvasWrap { flex: 1; position: relative; min-width: 0; background: #0b0e14; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  #hint {
    position: absolute; left: 12px; bottom: 10px; font-size: 11px; color: #55617a;
    background: rgba(10,13,20,.6); padding: 3px 8px; border-radius: 6px; pointer-events: none;
  }

  /* ---------- sidebar ---------- */
  #side {
    width: 380px; background: var(--panel); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .sect { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .sect h2 { font-size: 12px; color: var(--dim); font-weight: 600; margin-bottom: 8px; letter-spacing: 1px; }
  .btnrow { display: flex; gap: 6px; flex-wrap: wrap; }
  button {
    background: var(--panel2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  button:hover:not(:disabled) { background: #232d40; border-color: #3a4a66; }
  button:disabled { opacity: .38; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #20180a; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #f2c561; }
  button.danger { border-color: #6b3a3a; }
  button.armable.armed { border-color: var(--ok); color: var(--ok); }
  .viewbtn { padding: 4px 8px; font-size: 12px; }
  .heightctl { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--dim); }
  .heightctl b { color: var(--accent); font-size: 14px; min-width: 48px; text-align: center; }

  /* ---------- log ---------- */
  #logsect { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #logfilters { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
  .fchip { padding: 1px 7px; font-size: 11px; border-radius: 4px; cursor: pointer; user-select: none;
           background: var(--panel2); border: 1px solid var(--line); color: var(--dim); }
  .fchip.on { color: var(--ink); border-color: var(--accent); }
  #log {
    flex: 1; overflow-y: auto; font: 11.5px/1.55 ui-monospace, Menlo, Consolas, monospace;
    background: #0d1119; border: 1px solid var(--line); border-radius: 6px; padding: 6px;
  }
  #log .row { display: flex; gap: 6px; padding: 1px 2px; border-bottom: 1px solid #131926; }
  #log .t { color: #55617a; flex: 0 0 58px; }
  #log .k { flex: 0 0 64px; text-align: center; border-radius: 3px; font-size: 10px; height: 15px; margin-top: 1.5px; }
  #log .m { color: #b9c4d8; word-break: break-all; }
  .k-state { background: #274a63; color: #9fd0f0; }
  .k-mechanism { background: #3d5a2e; color: #b5e39a; }
  .k-collision { background: #333; color: #aaa; }
  .k-intervention { background: #5a4520; color: #f0cf8a; }
  .k-diag { background: #5a2323; color: #f0a0a0; }
  .k-op { background: #3a2d5a; color: #c5b3f0; }
  .k-bell { background: #6b5310; color: #ffd75e; font-weight: 700; }
  .k-sign { background: #205a4a; color: #8af0d2; }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <h1>🔮 一颗弹珠，让整间实验室下班<span class="sub">桌面机械连锁 · 全链路真实碰撞驱动</span></h1>
    <nav id="stages"></nav>
    <div id="stats">
      <span>停点 <b id="stStop">待释放</b></span>
      <span class="bad">无因果 <b id="stAcausal">0</b></span>
      <span>碰撞→声音 <b id="stSnd">—</b></span>
      <span>碰撞 <b id="stCol">0</b></span>
      <span>仿真 <b id="stTime">0.0s</b></span>
    </div>
  </header>

  <div id="main">
    <div id="canvasWrap">
      <canvas id="cv"></canvas>
      <div id="hint">滚轮缩放 · 拖拽平移 · 空格暂停 · R 释放 · L 锁跷跷板 · B 插挡板 · G 重力 · [ ] 高度</div>
    </div>

    <aside id="side">
      <section class="sect">
        <h2>控制</h2>
        <div class="btnrow">
          <button id="btnRelease" class="primary">释放小球 (R)</button>
          <button id="btnPause">暂停 (空格)</button>
          <button id="btnReset" class="danger">重置</button>
        </div>
        <div class="btnrow" style="margin-top:8px">
          <button id="btnLock" class="armable">🔒 锁定跷跷板 (L)</button>
          <button id="btnBaffle" class="armable">🧱 插入挡板 (B)</button>
          <button id="btnGravity">⚖️ 重力 ×0.5 (G)</button>
        </div>
        <div class="heightctl">
          释放高度
          <button id="btnHminus">−5%</button>
          <b id="heightVal">100%</b>
          <button id="btnHplus">+5%</button>
          <span>（影响初始重力势能，±5% 内链条均可完成）</span>
        </div>
      </section>

      <section class="sect">
        <h2>视角（一镜全景 · 可缩放局部）</h2>
        <div class="btnrow" id="views">
          <button class="viewbtn" data-v="all">全景</button>
          <button class="viewbtn" data-v="ramp">坡道·跷跷板</button>
          <button class="viewbtn" data-v="gate">闸门</button>
          <button class="viewbtn" data-v="track">小车轨道</button>
          <button class="viewbtn" data-v="domino">多米诺</button>
          <button class="viewbtn" data-v="bell">敲铃·指示牌</button>
        </div>
      </section>

      <section class="sect" id="logsect">
        <h2>事件日志（只由真实碰撞/状态量产生）<button id="btnExport" style="float:right;padding:1px 8px;font-size:11px">导出 JSON</button></h2>
        <div id="logfilters"></div>
        <div id="log"></div>
      </section>
    </aside>
  </div>
</div>

    function reset() {
      // 睡眠全局开启：静息刚体（尤其高塔翻板——重体+软枢轴会被求解器迭代顺序
      // 系统性馈能，几分钟内慢慢爬过竖直自倒，无因敲铃）入睡后免疫漂移；
      // 真实碰撞（#8 撞塔等）会自动唤醒，因果链不受影响
      engine = Engine.create({ enableSleeping: true, positionIterations: 2, velocityIterations: 8 });
      engine.gravity.y = opts.gravityScale;
      simT = 0; pendingPairs = []; flags = {};
      state = {
        released: false, releaseAnim: -1, locked: false, baffleIn: false,
        gravityScale: opts.gravityScale, releaseScale: opts.releaseScale,
        stage: 0, stageT: [0], done: false, t: 0
      };
      log = [];
      stats = { collisions: 0, acausal: 0, soundDelays: [], stopStage: 0, stopReason: '', bellHitT: -1 };
      build();
      return api;
    }

    function seg(x1, y1, x2, y2, th, o) {
      o = o || {};
      var cx = (x1 + x2) / 2, cy = (y1 + y2) / 2, L = Math.hypot(x2 - x1, y2 - y1);
      // 默认 +2 浅重叠隐藏端棱；exact=true 时恰好对接（曲线密段用——平底滑盒会被
      // 重叠锯齿的多点接触冻结，而 ≤0.5° 的对接折角可被视为光滑）
      var len = o.exact ? L : L + 2;
      var opts = Object.assign({
        angle: Math.atan2(y2 - y1, x2 - x1), isStatic: true, friction: 0.05, restitution: 0
      }, o);
      delete opts.exact;
      return Bodies.rectangle(cx, cy, len, th, opts);
    }

    function build() {
      bodies = {};
      var add = function (b, key) { Composite.add(engine.world, b); if (key) bodies[key] = b; return b; };

      // 桌面（两段，中间是机器区）
      C.deskSegs.forEach(function (d, i) {
        add(Bodies.rectangle(d.x, d.y, d.w, d.h, { isStatic: true, label: 'desk', friction: 0.5 }), 'desk' + i);
      });

      // 曲坡道（深重叠多段近似光滑曲线；无顶棚，滚动不会跳离）
      var curve = sampleCurve(C.rampPoints, C.rampN);
      C.curve = curve;
      for (var i = 0; i < curve.length - 1; i++) {
        var a = curve[i], b = curve[i + 1];
        add(seg(a.x, a.y, b.x, b.y, 14, { label: 'ramp#' + i, friction: 0.01 }));
      }

      // 小球（releaseScale 沿切向精确微调 ±5% 释放高度）
      var base = curve[2];
      var dh = (opts.releaseScale - 1) * 543;
      var dd = dh / Math.max(0.55, base.ty);
      var bx = base.x - base.tx * dd + base.ty * (7 + C.ballR - 0.5); // 7 = 坡道半厚，球心贴面不嵌入
      var by = base.y - base.ty * dd - base.tx * (7 + C.ballR - 0.5);
      C.ballStart = { x: bx, y: by };
      ball = add(Bodies.circle(bx, by, C.ballR, {
        label: 'ball', density: C.ballDensity, friction: 0.01, frictionStatic: 0.05, restitution: 0.05
      }), 'ball');
      latch = add(Bodies.rectangle(bx + base.tx * 23, by + base.ty * 23, 12, 30, {
        isStatic: true, label: 'latch', angle: Math.atan2(base.ty, base.tx), friction: 0.1
      }), 'latch');

      // 跷跷板：轴块(锚定枢轴) + 左右臂 + 挡边。右臂尖端就是顶闸门的凸轮（无立柱/曲柄：
      // 立柱扫掠区与轨道面是空间冲突的，套筒闸门让凸轮只做纯上托运动）
      var pv = C.pivot;
      var axle = Bodies.rectangle(pv.x, pv.y, 14, C.beamTh);
      var armL = Bodies.rectangle(pv.x - 7 - C.beamArmL / 2, pv.y, C.beamArmL, C.beamTh);
      var armR = Bodies.rectangle(pv.x + 7 + C.beamArmR / 2, pv.y, C.beamArmR, C.beamTh);
      // 接球窝：窝口就是臂尖（坡道末端正下方，球离坡后直接掉入），窝底比臂面低 7px，窝底尾端立 32 高背墙
      // 球在窝底是纯垂向承托（无楔紧），背墙只受水平微力（W·sinβ）——垂直挡墙方案已否：
      // 球在墙+臂面楔紧里 Matter 位置校正会产生反向卡死扭矩；先前沿臂面滑入的窝口会挂住球也不可用
      var armL2 = Bodies.rectangle(pv.x - 79.5, pv.y, 145, C.beamTh);           // 枢轴段 lx −152..−7
      var sockFloor = Bodies.rectangle(pv.x - 172, pv.y - 17, 40, 6);            // 窝底 lx −192..−152，顶面 ly −14
      var sockWall = Bodies.rectangle(pv.x - 152, pv.y - 36, 6, 32);             // 背墙 lx −155..−149，ly −52..−20
      var counterw = Bodies.rectangle(pv.x + C.counterw.lx, pv.y + C.counterw.ly, C.counterw.w, C.counterw.h);
      var roller = Bodies.circle(pv.x + C.roller.lx, pv.y + C.roller.ly, C.roller.r, { label: 'roller', friction: 0 });
      beam = Body.create({ parts: [axle, armL2, armR, sockFloor, sockWall, counterw, roller], label: 'beam', friction: 0.3, restitution: 0, frictionAir: 0.08 }); // 梁阻尼：耗散甩鞭回弹，使滚轮撞舌后留在舌底持续上顶而非弹开
      Body.rotate(beam, C.restAngle); // 绕质心转
      var dMain = { x: pv.x - beam.parts[1].position.x, y: pv.y - beam.parts[1].position.y };
      Body.setPosition(beam, { x: beam.position.x + dMain.x, y: beam.position.y + dMain.y }); // 轴块中心对准枢轴
      add(beam, 'beam');
      // 枢轴支柱（纯装饰性静件，托住轴的视觉；与梁底留 2px）
      add(Bodies.rectangle(pv.x, (pv.y + 9 + 760) / 2 + 1, 12, 760 - pv.y - 9 - 2, { isStatic: true, label: 'beamPost', friction: 0.5 }), 'beamPost');
      add(Constraint.create({
        pointA: { x: pv.x, y: pv.y }, bodyB: beam,
        pointB: { x: pv.x - beam.position.x, y: pv.y - beam.position.y }, // 世界系偏移（Matter 按相对转角旋转）
        stiffness: 1, length: 0, label: 'beamPivot'
      }), 'beamPivot');

      // 限位：只有右限位（水平梁压在它上面休眠）。左限位已删除——甩鞭会隧穿静件，
      // 闸门由棘爪保持在高位，梁过转到哪都是无害的化妆效果
      var rsP = rotY(pv.x, pv.y, C.restAngle, 184, C.beamTh / 2);
      add(Bodies.rectangle(rsP.x, rsP.y + 5 - 0.3, 14, 10, { isStatic: true, label: 'rightStop', angle: C.restAngle }), 'rightStop');

      // ---- 套筒闸门：上段板 + 挡车齿 + 底舌 + 顶叉口；板底开槽（627~677）让轨道穿过 ----
      // 支撑链（v6）：出生桥板搁在静态轴肩上（零受载）→ 甩鞭撞舌把闸门抛上去（摩擦空气 1.0 限速），
      // 上行 7.5px 后桥板底面撞上静态承接台锁定高位——全程无持续受载接触链（Matter 位置投影
      // 墙会让任何准静态压载链冻结成不动点；动力学冲击+静态件承托是可靠的解）
      var slopeTh = Math.atan(C.trackSlope); // 轨道倾角（y-down，+x 下坡）；挡车齿/止动销都按此角预倾以贴合滑盒端面
      var stackX = C.gateX;
      C.stackX = stackX;
      var slabTop = 500, notchTop = 627; // 上段板 500..627，槽顶 627（高于车轮盘面顶 643 16px，高于车身顶 636 9px）
      var gFr = 0; // 闸门全域零摩擦：升降/滑移无楔
      var upper = Bodies.rectangle(stackX, (slabTop + notchTop) / 2, C.gate.w, notchTop - slabTop, { density: C.gate.density, friction: gFr });
      // 挡车齿：闸门左缘 772..780 向下伸到 645；探入车身顶(636) 9px / 轮盘顶(643) 2px；闸升 7.5px 后齿底(637.5)高于车身顶(638.6) 1.1px 放行
      var peg = Bodies.rectangle(stackX - C.gate.w / 2 + C.peg.w / 2, notchTop + C.peg.h / 2, C.peg.w, C.peg.h, { density: C.gate.density, friction: gFr }); // 竖直齿面挡竖直车头面（滑盒水平出生、自调倾角）；齿底须高于盒顶才算放行
      // 底舌：677.5..703.1（顶面出生低于轨道底面 11.1px，给 7.5px 顶升行程留净空 3.6px）；底面与滚轮顶出生留 6.6px 空程
      var tongue = Bodies.rectangle(stackX, C.tongue.top + C.tongue.h / 2, C.gate.w, C.tongue.h, { density: C.gate.density, friction: gFr });
      // 顶叉口：颊板带 473.35..482.35 夹导轨（与轨面各留 0.15px 隙，全程骑轨 200..489），
      // 桥板两半带 467.35..473.35（与轨面各留 0.3px 隙让槽）：桥板底面出生即搁在静态轴肩上（0.15 预载），
      // 闸门升 7.5px 后桥板底面(465.85)撞上静态承接台锁定——滚轮与舌底出生留 6.6px 空程（零受载出生链）
      var cheekL = Bodies.rectangle(stackX - 4.15, slabTop - 22.15, 4, 9, { density: 0.0004, friction: gFr });
      var cheekR = Bodies.rectangle(stackX + 4.15, slabTop - 22.15, 4, 9, { density: 0.0004, friction: gFr });
      var bridgeL = Bodies.rectangle(stackX - 7.15, slabTop - 29.65, 9.7, C.fork.bridgeH, { density: 0.0004, friction: gFr });
      var bridgeR = Bodies.rectangle(stackX + 7.15, slabTop - 29.65, 9.7, C.fork.bridgeH, { density: 0.0004, friction: gFr });
      // 配重帽：闸门的质心必须落在滚轮接触点(782)正上方——左缘的挡车齿把质心拉偏，这块 6×24 铜帽(+789)补回
      var balance = Bodies.rectangle(stackX + 7, slabTop + 12, 6, 24, { density: C.gate.density, friction: gFr });
      gate = Body.create({ parts: [upper, peg, tongue, cheekL, cheekR, bridgeL, bridgeR, balance], label: 'gate', friction: 0, restitution: 0, frictionAir: 0.15 }); // 阻尼限飞行：1.0=每步清零悬空锁死；0.15 保留弹道射程，触顶/回落由上限位+滚轮夹持接管
      add(gate, 'gate');
      rod = gate; // 别名，供探针使用
      // 垂直导轨（静态）：闸门顶叉口的全程滑轨，底端 489（出生颊板带 473.35..482.35 包住轨下端 8.65px，
      // 升满 7.5 后颊板带 465.85..474.85 仍全程骑轨；轨底端 489 比升满后上段板顶(492.5)低——上段板永不相撞）；
      // 底部轴肩两块（顶面 473.2）：出生桥板底面(473.35)搁在其上（0.15 预载）——闸门重量由静态件承担
      var railBar = Bodies.rectangle(stackX, 344.5, 4, 289, { friction: 0 });
      var collarL = Bodies.rectangle(stackX - 10, slabTop - 23.8, 7.4, 6, { friction: 0 });
      var collarR = Bodies.rectangle(stackX + 10, slabTop - 23.8, 7.4, 6, { friction: 0 });
      // 底舌上限位一块（底面 670.0 = 舌顶 677.5 − 7.5，厚 6 向上；横跨舌宽 772..792）：
      // 舌顶升 7.5px 触顶不再上穿（防穿轨弹跳），回落瞬间滚轮已顶在舌底（触顶时梁尖角 ≥−3° 滚轮顶 ≥699.8，
      // 舌底 695.6——跟随间隙 ≤4px，慢速对接不隧穿）——挡车齿底(637.5)让开车身顶(638.6) 1.1px，
      // 滚轮上顶+上限位夹持成固定点（R=7.5 承接台方案已废弃：支撑点落在桥板出生体积内必重叠）
      var tongueCeil = Bodies.rectangle(stackX, 667.0, 26, 6, { friction: 0 });
      var gateRail = Body.create({ parts: [railBar, collarL, collarR, tongueCeil], isStatic: true, label: 'gateRail', friction: 0 });
      add(gateRail, 'gateRail');
      C.gate0Y = gate.parts[1].position.y; // 用上段板部件坐标（复合体父级坐标在受载时会漂移，不可信）

      // ---- 轨道（高位连续无缝：套筒闸门不再需要在轨上开缺口）----
      var gateFaceL = stackX - C.gate.w / 2;                   // 闸门面 x = 772
      var crossX = gateFaceL - C.cart.w / 2;                   // 小车中心：车头盒面 0 隙贴闸门面（零摩擦滑车从静止准静态顶死挡车齿；留隙会被 settle 加速隧穿）
      var crossY = C.crossY;                                   // 闸门处轨面中心线高度
      var yAt = function (x) { return crossY + (x - (gateFaceL - 0.5)) * C.trackSlope; };
      C.trackY = yAt;
      add(seg(C.trackX1, yAt(C.trackX1), C.trackX2, yAt(C.trackX2), 10, { label: 'track1', friction: 0.15 }), 'track1');
      // 纯坡道延伸到 #0 背面：多米诺区左移到 950（距闸 168px），行程损失使到达速度 ~1.8px/step
      // 天然低于隧穿阈值——撞击是真实冲量，翻板被击离后自由倾倒，小车停在 #0 背面（无楔死）
      add(seg(C.trackX2, yAt(C.trackX2), C.domino.x0 - 7, yAt(C.domino.x0 - 7), 10, { label: 'track3', friction: 0.15 }), 'track3');
      C.flatY = yAt(C.flatEnd);
      C.baffle.y = yAt(C.baffle.x) - 6.5; // 挡板横在滑盒高度带（盒中心 = 轨面顶 −6.1）

      // ---- 滑车（零摩擦滑盒：Matter 求解器否决了一切轮式/载重方案——复合部件轮不能自转、静止接触里
      // 摩擦冲量为零、双接触位置投影形成不动点：盒(μ>0)/双轮/单轮/滚珠轴承/球上骑笼全部冻结或蠕行；
      // 唯一可靠的坡面运载是 μ=0 滑盒（无摩擦冲量可吃，重力分力持续加速）与自由滚动圆。故小车 =
      // 抛光导轨上的无摩擦滑橇（README 声明的摩擦近似）。能量：滑车重力势能）----
      var cartCx = crossX, cartCy = yAt(crossX) - 5 - C.cart.h / 2 + 0.5; // 水平出生（+0.5 浮高：settle 后角点触轨），下滑时自调坡角
      cart = add(Bodies.rectangle(cartCx, cartCy, C.cart.w, C.cart.h, {
        label: 'cart', density: 0.003, friction: 0, restitution: 0
      }), 'cart');
      // 拦阻联锁（静态，开闸事件撤除——能量与因果都来自闸门升起）：
      //  cartChock 前部门闩：竖直面贴车头下沿带（647..653 深重叠 ~6px，盒重水平压持成不动点）；
      //  cartStop  车尾止动销：防 settle 后溜。挡车齿只做视觉/二次拦阻（浅重叠擦碰不构成主拦阻）
      add(Bodies.rectangle(cartCx + C.cart.w / 2 - 2, cartCy + 4.5, 4, 9, { isStatic: true, label: 'cartChock', friction: 0.1 }), 'cartChock');
      add(Bodies.rectangle(cartCx - C.cart.w / 2 - 2, cartCy, 4, C.cart.h + 4, { isStatic: true, label: 'cartStop', friction: 0.1 }), 'cartStop');
      cartBody = cart;
      wheels = [];
      C.cartStart = { x: cartCx, y: cartCy };

      // ---- 多米诺台面（翻板阵列：每块骨牌是绕底座中心枢轴旋转的杠杆——
      // 工作近似声明：自由站立骨牌在 Matter 顺序冲量求解器里会把撞击动量经底座接触泄进静态大地，
      // 低速推永远翻不倒、高速推隧穿。枢轴化后任何高于底座的正向撞击都产生确定的前翻力矩，
      // 摩擦力不再参与因果链，完全符合"杠杆近似需声明"的约束）----
      var shelfTop = C.flatY + C.shelfDrop;
      C.shelfTop = shelfTop;
      add(Bodies.rectangle(1130, shelfTop + 5, 400, 10, { isStatic: true, label: 'shelf', friction: 0.9 }), 'shelf'); // 930..1330
      for (var d = 0; d < C.domino.n; d++) {
        var dx0 = C.domino.x0 + d * C.domino.dx;
        var tile = Bodies.rectangle(dx0, shelfTop - 4 - C.domino.h / 2,
          C.domino.w, C.domino.h, { label: 'domino#' + d, density: C.domino.density, friction: 0.9, restitution: 0 });
        Body.rotate(tile, -0.6 * DEG); // 预倾：过顶攀爬的势能垒减半，释放后更快被推倒（锁扣下静息由枢轴保持，不靠限位桩）
        Body.setStatic(tile, true); // 骨牌锁扣（先动后静缓存质量）：被运动刚体真实撞醒才脱扣，见 settleCollisions
        add(tile, 'domino#' + d);
        // 枢轴抬离台面 4px：底座悬空，前底角不会埋入台面形成引力回摆陷阱——
        // 纯转子零势垒，任何前向扰动都持续增长直至砸向下一块
        add(Constraint.create({
          pointA: { x: dx0, y: shelfTop - 4 }, bodyB: tile, pointB: { x: 0, y: C.domino.h / 2 },
          stiffness: 1, length: 0, label: 'dominoPivot#' + d
        }), 'dominoPivot#' + d);
        // 后倾限位桩：挡住翻板保持竖直；桩顶须低于凌空车鼻下沿，免得成为小车路径上的墙
        add(Bodies.rectangle(dx0 - C.domino.w / 2 - 2, shelfTop - 5, 4, 4,
          { isStatic: true, label: 'backstop#' + d, friction: 0.2 }), 'backstop#' + d);
      }
      // （无挡车桩：小车撞击后自然停在 #0 背面 0.2px 的静息接触上——联锁撤除后因果链里只有真实接触）
      // 高塔：绕底座枢轴的翻板（倒下时塔面上段扫过敲锤托盘）。
      // 出生为静件——塔底锁扣咬住底座（见 settleCollisions 锁扣脱扣分支）：
      // 重体+软枢轴的组合会被顺序求解器迭代顺序系统性馈能，几分钟内从 −1° 静息爬过
      // 竖直自倒（锁定场景 5.4s 无因敲铃事故）；锁扣下静件免疫漂移，#8 真实撞击才脱扣。
      // 密度 5x：压锤需要静态重量把锤盘推过平衡位（1.5x 靠在盘上不发声）；
      // 且半重力（0.5x）下塔冲角要从 46° 提到 55°+ 才够得着锤盘——余量来自密度
      var towerBody = Bodies.rectangle(C.tower.x, shelfTop - 4 - C.tower.h / 2, C.tower.w, C.tower.h,
        { label: 'tower', density: C.domino.density * 5, friction: 0.9, restitution: 0 });
      Body.setStatic(towerBody, true); // 必须"先动后静"： born-static 的刚体 setStatic(false) 不会恢复质量（Matter 只缓存动→静的原件）
      Body.rotate(towerBody, -1 * DEG);
      add(towerBody, 'tower');
      add(Constraint.create({
        pointA: { x: C.tower.x, y: shelfTop - 4 }, bodyB: towerBody, pointB: { x: 0, y: C.tower.h / 2 },
        stiffness: 1, length: 0, label: 'towerPivot'
      }), 'towerPivot');
      add(Bodies.rectangle(C.tower.x - C.tower.w / 2 - 2, shelfTop - 5, 4, 4,
        { isStatic: true, label: 'backstop#T', friction: 0.2 }), 'backstop#T');

      // ---- 敲锤（短臂托盘在左迎高塔，长臂锤头在右击铃）----
      var hp = C.hammer, ua = { x: Math.cos(hp.ang), y: Math.sin(hp.ang) };
      hp.py = shelfTop - 72; // 托盘顶面 ≈ 台面 −65，正对高塔顶角扫掠高度
      // 水平放置各零件后，绕支点转角（保证 hammer.angle 可读）
      var arm = Bodies.rectangle(hp.px + (hp.headL - hp.padL) / 2, hp.py, hp.padL + hp.headL, hp.armW);
      var pad = Bodies.rectangle(hp.px - hp.padL, hp.py, hp.pad.w, hp.pad.h);
      var head = Bodies.rectangle(hp.px + hp.headL, hp.py, hp.head.w, hp.head.h);
      hammer = Body.create({ parts: [arm, pad, head], label: 'hammer', density: 0.0012, friction: 0.3 });
      var com0 = { x: hammer.position.x, y: hammer.position.y };
      var pv0 = { x: hp.px, y: hp.py };
      Body.rotate(hammer, hp.ang);
      var c = Math.cos(hp.ang), s = Math.sin(hp.ang);
      var rp = { // 支点随旋转后的位置
        x: com0.x + c * (pv0.x - com0.x) - s * (pv0.y - com0.y),
        y: com0.y + s * (pv0.x - com0.x) + c * (pv0.y - com0.y)
      };
      Body.setPosition(hammer, { x: hammer.position.x + (pv0.x - rp.x), y: hammer.position.y + (pv0.y - rp.y) });
      add(hammer, 'hammer');
      add(Constraint.create({
        pointA: { x: hp.px, y: hp.py }, bodyB: hammer,
        pointB: { x: hp.px - hammer.position.x, y: hp.py - hammer.position.y }, // 世界系偏移
        stiffness: 1, length: 0, label: 'hammerPivot'
      }), 'hammerPivot');
      var headPart = hammer.parts[3];
      // 静止限位：与锤臂同倾角（避免水平顶面的一角嵌入斜臂产生寄生力矩）
      var stopTop = hp.py + C.hammer.stopDX * Math.tan(hp.ang) + (hp.armW / 2) / Math.cos(hp.ang) - 0.3;
      add(Bodies.rectangle(hp.px + C.hammer.stopDX, stopTop + 5 * Math.cos(hp.ang), 16, 10,
        { isStatic: true, label: 'hammerStop', angle: hp.ang }), 'hammerStop');
      add(Bodies.rectangle(hp.px, (686 + shelfTop) / 2, 12, shelfTop - 686, { isStatic: true, label: 'hammerPost' }), 'hammerPost');

      // ---- 铃（静挂；静止时锤头顶部与铃缘有约 14px 间隙）----
      var headTopY = headPart.bounds.min.y;
      C.bell.y = headTopY - 40;
      var bellBody = Body.create({
        parts: [
          Bodies.circle(C.bell.x, C.bell.y, C.bell.r),
          Bodies.rectangle(C.bell.x, C.bell.y - C.bell.r - 8, 10, 20)
        ],
        isStatic: true, label: 'bell'
      });
      add(bellBody, 'bell');
      add(Bodies.rectangle(1782, (559 + 760) / 2, 12, 760 - 559, { isStatic: true, label: 'bellPost' }), 'bellPost');
      add(Bodies.rectangle(1733, C.bell.y - C.bell.r - 20 + 6, 86, 12, { isStatic: true, label: 'bellArm' }), 'bellArm');

      // 小球归宿的软挡块
      add(Bodies.rectangle(C.bumper.x, C.bumper.y, C.bumper.w, C.bumper.h, { isStatic: true, label: 'bumper' }), 'bumper');

      Events.on(engine, 'collisionStart', function (ev) {
        for (var i = 0; i < ev.pairs.length; i++) pendingPairs.push(ev.pairs[i]);
      });
    }

    // ------------------------------------------------------------ events
    function emit(kind, msg, extra) {
      var e = Object.assign({ t: simT, wall: nowMs(), kind: kind, msg: msg }, extra || {});
      log.push(e);
      for (var i = 0; i < listeners.length; i++) {
        try { listeners[i](e); } catch (err) {}
      }
      return e;
    }
    function nowMs() { return (typeof performance !== 'undefined' ? performance.now() : Date.now()); }

    function stageUp(n, msg) {
      if (n <= state.stage) return;
      if (n > state.stage + 1) {
        stats.acausal++;
        emit('diag', '⚠ 无因果跳级：' + STAGES[n] + ' 于环节 ' + state.stage + ' 之前出现');
      }
      state.stage = n;
      while (state.stageT.length <= n) state.stageT.push(simT);
      stats.stopStage = n;
      emit('state', '【环节 ' + n + '/6】' + (msg || STAGES[n]), { stage: n });
    }

    function pairName(a, b) { return (a.label || 'body') + ' ↔ ' + (b.label || 'body'); }
    function isPair(a, b, la, lb) {
      var na = a.label || '', nb = b.label || '';
      return (na === la && nb === lb) || (na === lb && nb === la);
    }
    function either(a, b, prefix) {
      return (a.label || '').indexOf(prefix) === 0 || (b.label || '').indexOf(prefix) === 0;
    }
    function parent(b) { return b.parent && b.parent !== b ? b.parent : b; }

    function settleCollisions() {
      if (!pendingPairs.length) return;
      var q = pendingPairs; pendingPairs = [];
      for (var i = 0; i < q.length; i++) {
        var a = parent(q[i].bodyA), b = parent(q[i].bodyB);
        stats.collisions++;
        var initial = simT < 80;
        var extra = { pair: pairName(a, b), ids: a.id + '#' + b.id };

        if (isPair(a, b, 'ball', 'beam')) {
          if (!flags.ballBeam) {
            flags.ballBeam = true;
            stageUp(2, '小球压上跷跷板（真实接触 ball ↔ beam，id ' + extra.ids + '）');
          } else if (!initial) emit('collision', '小球与跷跷板再次接触', extra);
          continue;
        }
        // 锁扣脱扣（骨牌行 + 高塔共用模式）：这些绕底座枢轴的翻板是倒立摆几何
        // （枢轴在底座、质心在半高），重体+软枢轴会被顺序求解器迭代顺序系统性
        // 馈能，几分钟内从静息倾角爬过竖直自倒——无因连锁事故。对策：出生为静件
        // （先动后静以缓存质量），被"运动中的动态刚体"（速度 >0.15px/step，滤掉
        // 蠕变再触）真实碰撞才脱扣转自由翻倒。与小车拦阻联锁同一因果模式。
        // 必须置于 stage-5 等分支之前：collisionStart 每对只发一次，先释放再判级。
        var la = a.label || '', lb = b.label || '';
        var latchA = (la === 'tower' || la.indexOf('domino#') === 0) && a.isStatic;
        var latchB = (lb === 'tower' || lb.indexOf('domino#') === 0) && b.isStatic;
        if ((latchA || latchB) && !initial) {
          var lat = latchA ? a : b, oth = latchA ? b : a;
          var liveKey = 'live_' + lat.label;
          if (!flags[liveKey] && !oth.isStatic) {
            flags[liveKey] = true;
            Body.setStatic(lat, false);
            Matter.Sleeping.set(lat, false);
            emit('mechanism', (lat.label === 'tower' ? '塔底锁扣脱开：高塔' : '骨牌锁扣脱开：' + lat.label) +
              '由静件转为自由翻倒（真实接触 ' + pairName(a, b) + '，id ' + extra.ids + '）', extra);
          }
        }
        if (isPair(a, b, 'cart', 'domino#0') && !flags.cartDom) {
          flags.cartDom = true;
          stageUp(5, '小车撞上第一块多米诺（真实接触 cart ↔ domino#0，id ' + extra.ids + '）');
          continue;
        }
        if (isPair(a, b, 'tower', 'hammer') && !flags.towerPad) {
          flags.towerPad = true;
          emit('mechanism', '高塔砸中敲锤托盘（真实接触 tower ↔ hammer，id ' + extra.ids + '）');
          continue;
        }
        if (isPair(a, b, 'hammer', 'bell')) {
          if (!flags.bell) {
            flags.bell = true;
            stats.bellHitT = simT;
            stageUp(6, '锤头撞到铃！（真实接触 hammer ↔ bell，id ' + extra.ids + '）');
            var ev = emit('bell', '🔔 铃被敲响 — 指示牌翻到「下班」', extra);
            emit('sign', '指示牌：营业 → 下班（由敲铃事件驱动）', { cause: ev });
          }
          continue;
        }
        if (isPair(a, b, 'cart', 'baffle')) {
          if (!flags.baffleHit) {
            flags.baffleHit = true;
            emit('intervention', '🧱 小车撞上挡板，流程受阻（真实接触 cart ↔ baffle，id ' + extra.ids + '）');
          }
          continue;
        }
        if (either(a, b, 'backstop#')) continue; // 翻板后限位桩：出生贴靠与回摆接触都不进日志
        if (either(a, b, 'domino#') || a.label === 'tower' || b.label === 'tower') {
          if (!initial && flags.cartDom) {
            emit('collision', '多米诺碰撞 ' + pairName(a, b), extra);
          }
          continue;
        }
        var d = (q[i].collision && q[i].collision.depth) || 0;
        if (isPair(a, b, 'cart', 'gate') || isPair(a, b, 'wheel', 'gate')) {
          if (!initial && d >= 0.05) emit('collision', '车轮与闸门接触 ' + pairName(a, b) + '（深度 ' + d.toFixed(2) + '）', extra);
          continue;
        }
        if (isPair(a, b, 'beam', 'gate')) { // 臂尖滚轮(梁部件) ↔ 底舌(闸门部件)：预载与顶升的接触证据
          var gk = 'stack-' + (flags.ballBeam ? 'lift' : 'pre');
          if (!flags[gk]) {
            flags[gk] = true;
            emit('mechanism', (flags.ballBeam ? '顶升接触：跷跷板臂尖滚轮托着闸门底舌上升（' : '装配预载：') + pairName(a, b) + '，id ' + extra.ids + '）', extra);
          }
          continue;
        }
        if (isPair(a, b, 'gate', 'gateRail')) { // 顶叉口骑垂直导轨：颊板间隙 0.15px 的滑动导向
          if (!flags.gateRailPre) {
            flags.gateRailPre = true;
            emit('mechanism', '装配预载：闸门顶叉口骑上垂直导轨、桥板搁在轴肩上（gate ↔ gateRail，id ' + extra.ids + '）', extra);
          }
          if (!initial && d >= 0.05 && !flags.gateHung) { // 桥板飞升后落上承接台：闸门锁定在高位
            flags.gateHung = true;
            emit('mechanism', '闸门顶叉口桥板底面撞上上方承接台（gate ↔ gateRail，深度 ' + d.toFixed(2) + '：齿底让开车身，闸门锁定高位）', extra);
          }
          continue;
        }
        if (isPair(a, b, 'ball', 'latch')) continue;
        if (isPair(a, b, 'beam', 'leftStop')) {
          if (!initial && !flags.leftStop) { flags.leftStop = true; emit('mechanism', '跷跷板压到下限位（beam ↔ leftStop）', extra); }
          continue;
        }
        if (isPair(a, b, 'beam', 'rightStop')) {
          if (!initial && !flags.rightStop) { flags.rightStop = true; emit('mechanism', '跷跷板回到右限位（beam ↔ rightStop）', extra); }
          continue;
        }
        if (!initial) emit('collision', '碰撞 ' + pairName(a, b), extra);
      }
    }

    function detectState() {
      if (state.done) return;
      var ang = beam.angle;
      if (flags.ballBeam && !flags.beamDown && ang < -0.4 * DEG) {
        flags.beamDown = true;
        emit('mechanism', '跷跷板被压下 ' + (ang / DEG).toFixed(2) + '°，臂尖滚轮经底舌上托闸门');
      }
      if (!flags.gateOpen && gate.parts[1].position.y < C.gate0Y - 6.4) {
        flags.gateOpen = true;
        stageUp(3, '闸门升起到位（gate.y ' + gate.position.y.toFixed(1) + '，挡车齿已高于车身顶），小车被放行');
        ['cartChock', 'cartStop'].forEach(function (k) { // 撤除拦阻联锁
          if (bodies[k]) {
            Composite.remove(engine.world, bodies[k]);
            emit('mechanism', k === 'cartChock' ? '前部门闩撤除：滑车车头解锁' : '车尾止动销撤除：滑车开始下滑');
          }
        });
        Matter.Sleeping.set(cart, false); // 睡眠引擎下撤除静件无碰撞事件：必须显式唤醒，否则小车悬空不醒
      }
      if (flags.gateOpen && !flags.cartFree && cart.position.x > C.stackX + 30) {
        flags.cartFree = true;
        stageUp(4, '小车通过闸门平面（cart.x=' + cart.position.x.toFixed(1) + '）');
      }
      if (state.locked && flags.ballBeam && !flags.lockNoted && simT - state.lockT > 600 && ang > -0.4 * DEG) {
        flags.lockNoted = true;
        emit('intervention', '🔒 跷跷板被锁定：球已到位但横梁转角 ' + (ang / DEG).toFixed(1) + '°，后续机构保持静止');
      }
      if (flags.bell && !state.done) {
        state.done = true;
        finalize('链条完成：敲铃并切换指示牌');
      }
    }

    function finalize(reason) {
      stats.stopStage = state.stage;
      if (state.stage === 6) stats.stopReason = '完成：' + reason;
      else if (state.locked) stats.stopReason = '停在环节 2（跷跷板被锁定，因果链在此中断）';
      else if (state.baffleIn) stats.stopReason = '停在环节 4（挡板挡住小车，因果链在此中断）';
      else stats.stopReason = '停在环节 ' + state.stage + '（' + STAGES[state.stage] + '）';
    }

    // ------------------------------------------------------- public api
    var api = {
      Matter: Matter, C: C, STAGES: STAGES,
      get engine() { return engine; },
      get state() { return state; },
      get log() { return log; },
      get stats() { return stats; },
      get bodies() { return bodies; },
      step: function (dt) {
        if (state.done) return;
        if (state.releaseAnim >= 0) {
          state.releaseAnim += dt;
          if (state.releaseAnim >= 140) {
            Composite.remove(engine.world, latch); latch = null; state.releaseAnim = -1;
            emit('mechanism', '释放插销完全撤出，小球开始滚动');
          } else {
            Body.setPosition(latch, { x: latch.position.x + latch.__dx / 140 * dt, y: latch.position.y + latch.__dy / 140 * dt });
          }
        }
        Engine.update(engine, dt);
        simT += dt; state.t = simT;
        settleCollisions();
        detectState();
      },
      release: function () {
        if (state.released) return false;
        state.released = true;
        stageUp(1, '释放插销撤出，小球沿坡滚动');
        Matter.Sleeping.set(ball, false); // 防用户久置后球已入睡、插销撤出无碰撞可唤醒
        var p0 = C.curve[2];
        latch.__dx = p0.ty * 46; latch.__dy = -p0.tx * 46;
        state.releaseAnim = 0;
        emit('op', '👆 操作：释放小球（releaseScale=' + opts.releaseScale.toFixed(3) +
          '，释放点距跷跷板盘面 ' + Math.round(700 - 23 - C.ballStart.y) + 'px）');
        return true;
      },
      lockSeesaw: function () {
        if (!api.can.lockSeesaw()) return false;
        state.locked = true; state.lockT = simT;
        // 楔块垫在球窝底正下方（球窝底面 = 枢轴 y−14；梁左端可旋转部分里最靠下的水平面）。
        // lx −170 处没有梁臂（臂尖 −152），旧算法按臂底面 y+7 放置 = 悬在球窝下方 20px 的空气里，什么都没挡。
        // 0.3px 预压嵌入球窝底面，球落进窝里的冲击经楔块直泄静态大地 → 准静态冻结。
        var bx = C.pivot.x - 178, top = C.pivot.y - 14.3;
        lockBlock = Bodies.rectangle(bx, top + 20, 20, 40, { isStatic: true, label: 'lockBlock', friction: 0.4 });
        Composite.add(engine.world, lockBlock);
        bodies.lockBlock = lockBlock;
        emit('intervention', '🔒 干预（事件节点：球已释放、尚未接触跷跷板）：锁定楔块插入，跷跷板被固定');
        return true;
      },
      insertBaffle: function () {
        if (!api.can.insertBaffle()) return false;
        state.baffleIn = true;
        baffleBody = Bodies.rectangle(C.baffle.x, C.baffle.y - 60, C.baffle.w, C.baffle.h,
          { isStatic: true, label: 'baffle', friction: 0.3 });
        Composite.add(engine.world, baffleBody);
        bodies.baffle = baffleBody;
        state.baffleAnim = 0;
        emit('intervention', '🧱 干预（事件节点：闸门开启后、小车进入多米诺区前）：挡板插入轨道');
        return true;
      },
      setGravity: function (s) { // s = 标称重力比例（0.5 = 减半）；内部 px 步长单位不泄漏给调用方
        state.gravityScale = s; engine.gravity.y = opts.gravityScale * s;
        emit('intervention', '⚖️ 干预：重力调为标称的 ' + Math.round(s * 100) + '%（g=' + (opts.gravityScale * s).toFixed(3) + ' px/步²）');
      },
      setReleaseScale: function (s) {
        if (state.released) return false;
        opts.releaseScale = clamp(s, 0.95, 1.05);
        state.releaseScale = opts.releaseScale;
        var p0 = C.curve[2];
        var dh = (opts.releaseScale - 1) * 543;
        var dd = dh / Math.max(0.55, p0.ty);
        Body.setPosition(ball, {
          x: p0.x - p0.tx * dd + p0.ty * (C.ballR - 0.5),
          y: p0.y - p0.ty * dd - p0.tx * (C.ballR - 0.5)
        });
        Body.setVelocity(ball, { x: 0, y: 0 }); Body.setAngularVelocity(ball, 0);
        C.ballStart = { x: ball.position.x, y: ball.position.y };
        if (latch) {
          Body.setPosition(latch, { x: ball.position.x + p0.tx * 17, y: ball.position.y + p0.ty * 17 });
          Body.setAngle(latch, Math.atan2(p0.ty, p0.tx));
        }
        emit('intervention', '📏 干预：释放高度调整为基准的 ' + Math.round(opts.releaseScale * 100) + '%');
        return true;
      },
      can: {
        lockSeesaw: function () {
          // 事件节点 = 球已释放、尚未接触跷跷板（球滚 ~2s，窗口充裕；勿再加 releaseAnim 等瞬时条件——插销动画仅 140ms，会把人类点击窗口挤没）
          return !!(state.released && !flags.ballBeam && !state.locked);
        },
        insertBaffle: function () {
          return !!(flags.gateOpen && !flags.cartDom && !state.baffleIn && !state.done);
        }
      },
      recordSoundDelay: function (ms) { stats.soundDelays.push(ms); },
      onEvent: function (fn) { listeners.push(fn); return api; },
      reset: reset,
      probe: function () {
        return {
          t: simT,
          ball: ball ? [ball.position.x, ball.position.y] : null,
          ballV: ball ? Math.hypot(ball.velocity.x, ball.velocity.y) : 0,
          beamAngle: beam.angle / DEG,
          gateY: gate.parts[1].position.y,
          rodY: rod.position.y,
          cartX: cart.position.x,
          hammerAngle: hammer.angle / DEG,
          stage: state.stage
        };
      }
    };

    // 挡板插入动画（在 step 中处理）
    var _step0 = api.step;
    api.step = function (dt) {
      if (state.baffleAnim !== undefined && state.baffleAnim >= 0 && baffleBody) {
        state.baffleAnim += dt;
        var k = Math.min(1, state.baffleAnim / 200);
        Body.setPosition(baffleBody, { x: C.baffle.x, y: C.baffle.y - 60 + 60 * k });
        if (k >= 1) state.baffleAnim = -1;
      }
      _step0(dt);
    };

    reset();
    return api;
  }

  return { createWorld: createWorld, STEP_MS: STEP_MS, STAGES: STAGES };
});
</script>
<script>/*
 * main.js — 渲染 + 音效 + UI + 日志面板
 * 物理与因果全部在 world.js：本文件只做呈现，不干预力学。
 * 声音只由 world 的真实事件（碰撞/机制/铃）驱动；每声记录的延迟计入诊断量。
 */
'use strict';
(function () {
  var Matter = window.Matter;
  var MW = window.MarbleWorld;
  var world = MW.createWorld(Matter);
  var STEP = MW.STEP_MS;
  var STAGES = MW.STAGES;

  // ---------------------------------------------------------------- canvas & camera
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var cam = { s: 0.6, x: 0, y: 0 };           // s: px/世界px；x,y: 世界坐标在画布中心
  var dpr = 1, cw = 0, ch = 0;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    var r = cv.parentElement.getBoundingClientRect();
    cw = r.width; ch = r.height;
    cv.width = cw * dpr; cv.height = ch * dpr;
  }
  window.addEventListener('resize', resize); resize();

  function worldBounds() {
    var bs = Matter.Composite.allBodies(world.engine.world);
    var min = { x: 1e9, y: 1e9 }, max = { x: -1e9, y: -1e9 };
    bs.forEach(function (b) {
      min.x = Math.min(min.x, b.bounds.min.x); max.x = Math.max(max.x, b.bounds.max.x);
      min.y = Math.min(min.y, b.bounds.min.y); max.y = Math.max(max.y, b.bounds.max.y);
    });
    return { min: min, max: max };
  }
  function fitAll() {
    var b = worldBounds();
    var pad = 40;
    var s = Math.min((cw - pad * 2) / (b.max.x - b.min.x), (ch - pad * 2) / (b.max.y - b.min.y));
    cam.s = s;
    cam.x = (b.min.x + b.max.x) / 2;
    cam.y = (b.min.y + b.max.y) / 2;
  }
  var VIEWS = {
    all: null,
    ramp: { x: 400, y: 570, s: 1.35 },
    gate: { x: 790, y: 600, s: 2.2 },
    track: { x: 900, y: 675, s: 2.0 },
    domino: { x: 1120, y: 660, s: 1.9 },
    bell: { x: 1410, y: 610, s: 2.0 }
  };
  function setView(name) {
    var v = VIEWS[name];
    if (!v) { fitAll(); return; }
    cam.x = v.x; cam.y = v.y; cam.s = v.s;
  }
  function worldToScreen(p) { return { x: (p.x - cam.x) * cam.s + cw / 2, y: (p.y - cam.y) * cam.s + ch / 2 }; }
  function screenToWorld(p) { return { x: (p.x - cw / 2) / cam.s + cam.x, y: (p.y - ch / 2) / cam.s + cam.y }; }

  // wheel zoom around cursor
  cv.addEventListener('wheel', function (e) {
    e.preventDefault();
    var before = screenToWorld({ x: e.offsetX, y: e.offsetY });
    cam.s *= Math.exp(-e.deltaY * 0.0012);
    cam.s = Math.max(0.15, Math.min(8, cam.s));
    var after = screenToWorld({ x: e.offsetX, y: e.offsetY });
    cam.x += before.x - after.x; cam.y += before.y - after.y;
  }, { passive: false });
  // drag pan
  var drag = null;
  cv.addEventListener('mousedown', function (e) { drag = { x: e.clientX, y: e.clientY }; cv.classList.add('dragging'); });
  window.addEventListener('mousemove', function (e) {
    if (!drag) return;
    cam.x -= (e.clientX - drag.x) / cam.s; cam.y -= (e.clientY - drag.y) / cam.s;
    drag = { x: e.clientX, y: e.clientY };
  });
  window.addEventListener('mouseup', function () { drag = null; cv.classList.remove('dragging'); });
  document.querySelectorAll('#views .viewbtn').forEach(function (b) {
    b.addEventListener('click', function () { setView(b.dataset.v); });
  });

  // ---------------------------------------------------------------- audio（只由真实事件驱动）
  var AC = window.AudioContext || window.webkitAudioContext;
  var actx = null;
  function audio() {
    if (!actx) { try { actx = new AC(); } catch (e) { return null; } }
    if (actx.state === 'suspended') { actx.resume(); return null; } // 首次手势解锁，本声放弃
    return actx;
  }
  function noiseBuffer(a, dur) {
    var buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }
  // 铃：非谐波分音列（敲击金属的特征频谱），指数衰减
  function playBell(vol, when) {
    var a = audio(); if (!a) return false;
    var f0 = 987.77; // B5
    var partials = [[1, 1], [2.01, 0.55], [2.74, 0.4], [5.43, 0.22], [8.21, 0.1]];
    partials.forEach(function (p) {
      var o = a.createOscillator(), g = a.createGain();
      o.type = 'sine'; o.frequency.value = f0 * p[0] * (1 + (Math.random() - 0.5) * 0.004);
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(0.35 * vol * p[1], when + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, when + 2.6 - p[1]);
      o.connect(g); g.connect(a.destination);
      o.start(when); o.stop(when + 2.8);
    });
    return true;
  }
  function playThud(vol, pitch, when) {
    var a = audio(); if (!a) return false;
    var o = a.createOscillator(), g = a.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(pitch, when);
    o.frequency.exponentialRampToValueAtTime(Math.max(40, pitch * 0.4), when + 0.09);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(0.25 * vol, when + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.14);
    o.connect(g); g.connect(a.destination);
    o.start(when); o.stop(when + 0.16);
    var n = a.createBufferSource(), ng = a.createGain(), f = a.createBiquadFilter();
    n.buffer = noiseBuffer(a, 0.1);
    f.type = 'bandpass'; f.frequency.value = 900 + pitch * 3; f.Q.value = 1.2;
    ng.gain.setValueAtTime(0.0001, when);
    ng.gain.exponentialRampToValueAtTime(0.18 * vol, when + 0.003);
    ng.gain.exponentialRampToValueAtTime(0.0001, when + 0.09);
    n.connect(f); f.connect(ng); ng.connect(a.destination);
    n.start(when);
    return true;
  }
  function playClick(when, freq) {
    var a = audio(); if (!a) return false;
    var o = a.createOscillator(), g = a.createGain();
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(0.12, when + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.05);
    o.connect(g); g.connect(a.destination);
    o.start(when); o.stop(when + 0.06);
    return true;
  }

  // ---------------------------------------------------------------- 事件 → 声音/特效/日志
  var fx = { bell: 0, sign: -1, signT: 1, flash: {} };
  var lastThud = 0;
  function onEvent(e) {
    // 日志
    logAdd(e);
    // 声音：全部只在真实事件上触发；延迟 = 事件产生到声音开响的墙钟差
    var now = performance.now();
    var played = false;
    if (e.kind === 'bell') { played = playBell(1, actx ? actx.currentTime : 0); fx.bell = 1; }
    else if (e.kind === 'sign') { played = playClick(actx ? actx.currentTime : 0, 660); fx.sign = -fx.sign; fx.signT = 0; }
    else if (e.kind === 'collision') {
      if (now - lastThud > 45) { // 限频，避免多米诺连倒时爆音
        var depthM = e.msg.match(/深度 ([\d.]+)/);
        var v = Math.min(1, (depthM ? parseFloat(depthM[1]) : 0.4) / 1.2);
        played = playThud(0.35 + 0.65 * v, 140 + 220 * v, actx ? actx.currentTime : 0);
        lastThud = now;
      }
    }
    else if (e.kind === 'mechanism') {
      if (/闸门升起到位|锁定高位/.test(e.msg)) played = playThud(0.8, 90, actx ? actx.currentTime : 0);
      else if (/锁扣脱开|门闩撤除|止动销撤除/.test(e.msg)) played = playClick(actx ? actx.currentTime : 0, 300);
    }
    else if (e.kind === 'op') played = playClick(actx ? actx.currentTime : 0, 520);
    if (played) world.recordSoundDelay(performance.now() - e.wall);
    // 环节 chips
    if (e.kind === 'state') refreshChips(e.stage);
  }
  world.onEvent(onEvent);

  // ---------------------------------------------------------------- 日志面板
  var logEl = document.getElementById('log');
  var filtersEl = document.getElementById('logfilters');
  var KINDS = [['state', '环节'], ['mechanism', '机构'], ['collision', '碰撞'], ['intervention', '干预'], ['op', '操作'], ['diag', '诊断'], ['bell', '铃'], ['sign', '指示牌']];
  var showKinds = {};
  KINDS.forEach(function (k) { showKinds[k[0]] = true; });
  KINDS.forEach(function (k) {
    var c = document.createElement('span');
    c.className = 'fchip on'; c.textContent = k[1]; c.dataset.k = k[0];
    c.addEventListener('click', function () {
      showKinds[k[0]] = !showKinds[k[0]];
      c.classList.toggle('on', showKinds[k[0]]);
      refreshLog();
    });
    filtersEl.appendChild(c);
  });
  var MAXROWS = 400;
  function logAdd(e) {
    if (!showKinds[e.kind]) return;
    var row = document.createElement('div');
    row.className = 'row';
    var t = document.createElement('span'); t.className = 't'; t.textContent = (e.t / 1000).toFixed(2) + 's';
    var k = document.createElement('span'); k.className = 'k k-' + e.kind; k.textContent = (KINDS.find(function (x) { return x[0] === e.kind; }) || ['', e.kind])[1];
    var m = document.createElement('span'); m.className = 'm'; m.textContent = e.msg;
    row.appendChild(t); row.appendChild(k); row.appendChild(m);
    logEl.appendChild(row);
    while (logEl.children.length > MAXROWS) logEl.removeChild(logEl.firstChild);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function refreshLog() {
    logEl.innerHTML = '';
    world.log.forEach(logAdd);
  }
  document.getElementById('btnExport').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify({ log: world.log, stats: world.stats, stages: STAGES }, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'marble-chain-log.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  // ---------------------------------------------------------------- 控制
  var paused = false;
  var btnRelease = document.getElementById('btnRelease');
  var btnPause = document.getElementById('btnPause');
  var btnLock = document.getElementById('btnLock');
  var btnBaffle = document.getElementById('btnBaffle');
  var btnGravity = document.getElementById('btnGravity');
  var heightVal = document.getElementById('heightVal');

  btnRelease.addEventListener('click', function () { audio(); world.release(); });
  btnPause.addEventListener('click', togglePause);
  function togglePause() {
    paused = !paused;
    btnPause.textContent = paused ? '继续 (空格)' : '暂停 (空格)';
  }
  document.getElementById('btnReset').addEventListener('click', resetAll);
  btnLock.addEventListener('click', function () { world.lockSeesaw(); });
  btnBaffle.addEventListener('click', function () { world.insertBaffle(); });
  btnGravity.addEventListener('click', function () {
    var g = world.state.gravityScale === 1 ? 0.5 : 1;
    world.setGravity(g);
    btnGravity.textContent = '⚖️ 重力 ×' + g + ' (G)';
  });
  function bumpHeight(d) {
    if (world.state.released) return;
    var s = Math.round((world.state.releaseScale + d) * 100) / 100;
    if (world.setReleaseScale(s)) {
      heightVal.textContent = Math.round(s * 100) + '%';
    }
  }
  document.getElementById('btnHminus').addEventListener('click', function () { bumpHeight(-0.05); });
  document.getElementById('btnHplus').addEventListener('click', function () { bumpHeight(0.05); });

  window.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT') return;
    switch (e.key) {
      case ' ': e.preventDefault(); togglePause(); break;
      case 'r': case 'R': audio(); world.release(); break;
      case 'l': case 'L': world.lockSeesaw(); break;
      case 'b': case 'B': world.insertBaffle(); break;
      case 'g': case 'G': btnGravity.click(); break;
      case '[': bumpHeight(-0.05); break;
      case ']': bumpHeight(0.05); break;
    }
  });

  function resetAll() {
    world.reset();
    paused = false;
    btnPause.textContent = '暂停 (空格)';
    btnGravity.textContent = '⚖️ 重力 ×1 (G)';
    heightVal.textContent = Math.round(world.state.releaseScale * 100) + '%';
    fx.bell = 0; fx.sign = -1; fx.signT = 1;
    refreshChips(0);
    refreshLog();
    fitAll();
  }

  // ---------------------------------------------------------------- 环节 chips & 统计条
  var chipsEl = document.getElementById('stages');
  var chips = STAGES.map(function (s, i) {
    var c = document.createElement('span');
    c.className = 'chip'; c.textContent = i + ' ' + s;
    chipsEl.appendChild(c);
    return c;
  });
  function refreshChips(stage) {
    chips.forEach(function (c, i) {
      c.classList.toggle('active', i === stage);
      c.classList.toggle('done', i < stage);
    });
  }
  refreshChips(0);

  var stStop = document.getElementById('stStop');
  var stAcausal = document.getElementById('stAcausal');
  var stSnd = document.getElementById('stSnd');
  var stCol = document.getElementById('stCol');
  var stTime = document.getElementById('stTime');
  function refreshStats() {
    var st = world.state, stats = world.stats;
    stStop.textContent = st.done ? (stats.stopReason || STAGES[st.stage]) : STAGES[st.stage];
    stAcausal.textContent = stats.acausal;
    stCol.textContent = stats.collisions;
    stTime.textContent = (st.t / 1000).toFixed(1) + 's';
    if (stats.soundDelays.length) {
      var mx = 0, sum = 0;
      stats.soundDelays.forEach(function (d) { mx = Math.max(mx, d); sum += d; });
      stSnd.textContent = (sum / stats.soundDelays.length).toFixed(1) + '/' + mx.toFixed(1) + 'ms';
    } else stSnd.textContent = '—';
    // 干预按钮武装态
    var canLock = world.can.lockSeesaw();
    btnLock.disabled = !canLock && !st.locked;
    btnLock.classList.toggle('armed', canLock);
    if (st.locked) { btnLock.textContent = '🔒 已锁定'; }
    var canBaffle = world.can.insertBaffle();
    btnBaffle.disabled = !canBaffle && !st.baffleIn;
    btnBaffle.classList.toggle('armed', canBaffle);
    if (st.baffleIn) { btnBaffle.textContent = '🧱 挡板已插入'; }
    btnRelease.disabled = st.released;
    var hOn = !st.released;
    document.getElementById('btnHminus').disabled = !hOn || world.state.releaseScale <= 0.95;
    document.getElementById('btnHplus').disabled = !hOn || world.state.releaseScale >= 1.05;
  }

  // ---------------------------------------------------------------- 渲染
  function shade(hex, f) { // 简易明暗
    var n = parseInt(hex.slice(1), 16);
    var r = Math.min(255, Math.max(0, ((n >> 16) & 255) * f)) | 0;
    var g = Math.min(255, Math.max(0, ((n >> 8) & 255) * f)) | 0;
    var b = Math.min(255, Math.max(0, (n & 255) * f)) | 0;
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  var MAT = {
    ball: { fill: '#e05252', stroke: '#ffd0d0' },
    beam: { fill: '#b98a4a', stroke: '#e8c88a' },
    gate: { fill: '#d4af37', stroke: '#f4e2a0' },
    track: { fill: '#8a6a3f', stroke: '#c8a86a' },
    shelf: { fill: '#7a5c38', stroke: '#b09055' },
    cart: { fill: '#7f9db9', stroke: '#c0d4e8' },
    domino: { fill: '#f2ead8', stroke: '#c8b890' },
    tower: { fill: '#e8dcc0', stroke: '#c0a860' },
    hammer: { fill: '#c9a227', stroke: '#f0d878' },
    bell: { fill: '#ffd75e', stroke: '#fff0b0' },
    steel: { fill: '#5a6a80', stroke: '#8a9ab0' },
    wood: { fill: '#6a4f30', stroke: '#9a7a50' }
  };
  function matOf(b) {
    var l = b.label || '';
    if (l === 'ball') return MAT.ball;
    if (l === 'beam' || l.indexOf('beam') === 0) return MAT.beam;
    if (l === 'gate') return MAT.gate;
    if (l.indexOf('track') === 0 || l === 'ramp') return MAT.track;
    if (l === 'shelf') return MAT.shelf;
    if (l === 'cart') return MAT.cart;
    if (l.indexOf('domino#') === 0) return MAT.domino;
    if (l === 'tower') return MAT.tower;
    if (l === 'hammer') return MAT.hammer;
    if (l === 'bell') return MAT.bell;
    if (l === 'bumper' || l === 'hammerStop') return MAT.wood;
    return MAT.steel;
  }
  function trace(verts) {
    ctx.beginPath();
    ctx.moveTo(verts[0].x, verts[0].y);
    for (var i = 1; i < verts.length; i++) ctx.lineTo(verts[i].x, verts[i].y);
    ctx.closePath();
  }
  function drawBody(b) {
    var mat = matOf(b);
    var parts = b.parts && b.parts.length > 1 ? b.parts.slice(1) : [b];
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      trace(p.vertices);
      ctx.fillStyle = mat.fill;
      ctx.fill();
      ctx.lineWidth = Math.max(1, 1.2 / cam.s * 2);
      ctx.strokeStyle = mat.stroke;
      ctx.stroke();
    }
    // 骨牌点数 & 高塔纹
    if (b.label && b.label.indexOf('domino#') === 0) {
      ctx.fillStyle = '#a03838';
      ctx.beginPath(); ctx.arc(b.position.x, b.position.y - 10, 2.2, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(b.position.x, b.position.y + 8, 2.2, 0, 7); ctx.fill();
    }
    if (b.label === 'tower') {
      ctx.strokeStyle = '#a03838'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(b.position.x - 5, b.position.y - 20); ctx.lineTo(b.position.x + 5, b.position.y - 20);
      ctx.moveTo(b.position.x - 5, b.position.y); ctx.lineTo(b.position.x + 5, b.position.y);
      ctx.stroke();
    }
  }

  var STATION_LABELS = [
    [180, 470, '① 曲坡道'], [520, 790, '② 跷跷板'], [782, 470, '③ 套筒闸门'],
    [900, 740, '④ 无摩擦滑车'], [1100, 600, '⑤ 多米诺连锁'], [1420, 520, '⑥ 敲铃 · 指示牌']
  ];
  function drawScene() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // 背景：深夜实验室
    var g = ctx.createLinearGradient(0, 0, 0, ch);
    g.addColorStop(0, '#0d1220'); g.addColorStop(1, '#131a26');
    ctx.fillStyle = g; ctx.fillRect(0, 0, cw, ch);
    // 网格
    ctx.strokeStyle = 'rgba(80,100,140,0.07)'; ctx.lineWidth = 1;
    var step = 40 * cam.s;
    if (step > 12) {
      var ox = (cw / 2 - cam.x * cam.s) % step, oy = (ch / 2 - cam.y * cam.s) % step;
      ctx.beginPath();
      for (var x = ox; x < cw; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, ch); }
      for (var y = oy; y < ch; y += step) { ctx.moveTo(0, y); ctx.lineTo(cw, y); }
      ctx.stroke();
    }
    // 世界
    ctx.save();
    ctx.translate(cw / 2, ch / 2);
    ctx.scale(cam.s, cam.s);
    ctx.translate(-cam.x, -cam.y);

    // 地板
    ctx.fillStyle = '#1a2030';
    ctx.fillRect(60, 762, 1650, 60);
    ctx.strokeStyle = '#2a3550'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(60, 762); ctx.lineTo(1710, 762); ctx.stroke();

    var bs = Matter.Composite.allBodies(world.engine.world);
    bs.forEach(function (b) { if (b.parent === b) drawBody(b); });

    // 铃的摇晃（真实敲响后的视觉余韵）
    if (fx.bell > 0.01) {
      var bell = world.bodies.bell;
      if (bell) {
        var mount = { x: world.C.bell.x, y: world.C.bell.y - world.C.bell.r - 8 };
        ctx.save();
        ctx.translate(mount.x, mount.y);
        ctx.rotate(Math.sin(performance.now() * 0.02) * 0.16 * fx.bell);
        ctx.translate(-mount.x, -mount.y);
        ctx.globalAlpha = 0.5;
        drawBody(bell);
        ctx.globalAlpha = 1;
        ctx.restore();
      }
    }
    // 指示牌（营业/下班 翻面）
    var sx = 1560, sy = 700;
    ctx.fillStyle = '#3a3020'; ctx.fillRect(sx - 8, sy, 96, 66);
    ctx.fillStyle = '#241c10'; ctx.fillRect(sx - 2, sy - 6, 84, 8);
    var flip = fx.signT < 1 ? Math.cos(Math.min(1, fx.signT) * Math.PI) : (fx.sign > 0 ? -1 : 1);
    // sign=+1 → 下班；flip 控制水平压缩做翻面动画
    var w1 = 76, squish = Math.max(0.06, Math.abs(flip));
    ctx.save();
    ctx.translate(sx + w1 / 2, sy + 32);
    ctx.scale(squish, 1);
    var face = flip >= 0 ? '#f5eedc' : '#e8f0e8';
    if (fx.signT < 1 && flip < 0) face = '#e8f0e8';
    ctx.fillStyle = face;
    ctx.fillRect(-w1 / 2, -24, w1, 48);
    ctx.fillStyle = fx.sign > 0 ? '#1a7a3a' : '#b03030';
    ctx.font = 'bold 24px "PingFang SC", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(fx.sign > 0 ? '下班' : '营业', 0, 1);
    ctx.restore();

    // 站点标签
    if (cam.s > 0.45) {
      ctx.font = '13px "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      STATION_LABELS.forEach(function (s) {
        ctx.fillStyle = 'rgba(160,175,200,0.75)';
        ctx.fillText(s[2], s[0], s[1]);
      });
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------- 主循环
  // 注意：用 setInterval 而非 rAF 驱动——嵌入式/无头 webview 常把 rAF 整体节流，
  // 物理步进必须可靠；fixed-step 累加器与渲染解耦，60Hz 定时器即可
  var acc = 0, lastT = performance.now();
  function frame(now) {
    var dt = Math.min(100, now - lastT); lastT = now;
    if (!paused) {
      acc += dt;
      while (acc >= STEP) { world.step(STEP); acc -= STEP; }
    }
    fx.bell *= 0.985;
    if (fx.signT < 1) fx.signT = Math.min(1, fx.signT + dt / 600);
    drawScene();
    refreshStats();
  }
  setInterval(function () { frame(performance.now()); }, 1000 / 60);
  fitAll();
  refreshLog();
  frame(performance.now());
})();
</script>
</body>
</html>
