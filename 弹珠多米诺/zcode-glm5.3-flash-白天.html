<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弹珠下班装置 · 连锁机械实验室</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #161c28; --panel: #1e2635; --line: #2c3648;
  --text: #d8dee9; --dim: #8a94a6; --accent: #e0a458; --ok: #37b26c; --bad: #c9553d;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
}
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 18px; border-bottom: 1px solid var(--line);
}
h1 { font-size: 18px; }
h1 .sub { font-size: 12px; color: var(--dim); font-weight: normal; margin-left: 8px; }
.state-chips { display: flex; gap: 8px; }
.chip {
  background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
  font-size: 12px; padding: 4px 12px; color: var(--dim);
}
.chip b, .chip { font-variant-numeric: tabular-nums; }
main { flex: 1; display: flex; min-height: 0; }
.stage-wrap { flex: 1; position: relative; min-width: 0; }
#stage { width: 100%; height: 100%; display: block; cursor: grab; }
#stage:active { cursor: grabbing; }
.stage-hint {
  position: absolute; left: 12px; bottom: 10px; font-size: 11px; color: var(--dim);
  background: rgba(0,0,0,0.3); padding: 3px 10px; border-radius: 12px; pointer-events: none;
}
.sign-float {
  position: absolute; right: 16px; top: 14px;
  background: var(--ok); color: #fff; font-weight: bold; font-size: 15px;
  padding: 8px 18px; border-radius: 6px; border: 2px solid rgba(255,255,255,0.25);
  transition: background 0.4s;
}
.sign-float.off { background: var(--bad); }
.panel {
  width: 340px; border-left: 1px solid var(--line); background: var(--panel);
  display: flex; flex-direction: column; overflow: hidden;
}
.group { padding: 12px 14px; border-bottom: 1px solid var(--line); }
.group.grow { flex: 1; display: flex; flex-direction: column; min-height: 120px; }
h2 { font-size: 13px; color: var(--accent); margin-bottom: 10px; }
h2 .sub2 { font-size: 11px; color: var(--dim); font-weight: normal; }
.btn {
  display: block; width: 100%; text-align: left;
  background: #2a3446; color: var(--text); border: 1px solid var(--line);
  border-radius: 6px; padding: 9px 12px; font-size: 13px; margin-bottom: 8px;
  cursor: pointer; transition: background 0.15s, border-color 0.15s;
}
.btn:hover { background: #34405a; border-color: var(--accent); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: #222; font-weight: bold; border-color: var(--accent); }
.btn.primary:hover { background: #f0b468; }
.btn .tip { display: block; font-size: 10px; color: var(--dim); margin-top: 2px; }
.btn.small { display: inline-block; width: auto; flex: 1; text-align: center; margin-bottom: 0; }
.row { display: flex; gap: 8px; margin-top: 8px; }
.diag { font-size: 12px; }
.diag > div { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.diag span { color: var(--dim); }
.diag b { font-variant-numeric: tabular-nums; }
.log { flex: 1; overflow-y: auto; font-family: ui-monospace, Menlo, monospace; font-size: 11px; line-height: 1.55; }
.log .line { padding: 2px 4px; border-bottom: 1px solid rgba(255,255,255,0.04); word-break: break-all; }
.log .t { color: var(--dim); margin-right: 6px; }
.log .milestone { color: var(--accent); }
.log .anomaly { color: var(--bad); }
.log .contact { color: #9db4d0; }
.log .action { color: var(--ok); }
.log .sys, .log .sign { color: var(--dim); }

</style>
</head>
<body>
<header>
  <h1>弹珠下班装置 <span class="sub">一颗弹珠,让整间实验室下班</span></h1>
  <div class="state-chips">
    <span class="chip" id="chip-stage">环节:待释放</span>
    <span class="chip" id="chip-gravity">重力:1.00g</span>
    <span class="chip" id="chip-clock">t = 0.00s</span>
  </div>
</header>

<main>
  <section class="stage-wrap">
    <canvas id="stage"></canvas>
    <div class="stage-hint">滚轮缩放 · 拖拽平移 · 双击复位</div>
    <div class="sign-float" id="sign-float">营业中</div>
  </section>

  <aside class="panel">
    <div class="group">
      <h2>现场干预</h2>
      <button id="btn-release" class="btn primary">① 释放小球</button>
      <button id="btn-lock" class="btn">② 锁住跷跷板<span class="tip">球到达跷跷板前有效</span></button>
      <button id="btn-baffle" class="btn">③ 插入挡板<span class="tip">小车进入多米诺区前有效</span></button>
      <button id="btn-gravity" class="btn">④ 重力减半<span class="tip">0.5g,即时生效</span></button>
      <div class="row">
        <button id="btn-h095" class="btn small">释放高度 −5%</button>
        <button id="btn-h105" class="btn small">释放高度 +5%</button>
      </div>
      <div class="row">
        <button id="btn-pause" class="btn small">暂停</button>
        <button id="btn-reset" class="btn small">重置</button>
        <button id="btn-sound" class="btn small sound-on">声音开</button>
      </div>
    </div>

    <div class="group">
      <h2>诊断量</h2>
      <div class="diag">
        <div><span>停在环节</span><b id="diag-stop">—</b></div>
        <div><span>无因果事件</span><b id="diag-anomaly">0</b></div>
        <div><span>碰撞→声音时差</span><b id="diag-latency">0.00 ms(同帧)</b></div>
        <div><span>铃声次数</span><b id="diag-bell">0</b></div>
        <div><span>闸门抬升</span><b id="diag-gate">0.0 px</b></div>
        <div><span>小车位移</span><b id="diag-cart">0 px</b></div>
      </div>
    </div>

    <div class="group grow">
      <h2>事件日志 <span class="sub2">碰撞/约束可追溯,非标签切换</span></h2>
      <div class="log" id="log"></div>
    </div>
  </aside>
</main>

<script>/*
 * world.js — 弹珠下班装置 · 物理世界(无 DOM 依赖,浏览器/Node 通用)
 *
 * 因果链(全部由真实接触/力学联动触发,无统一时间轴):
 *   拔销释放小球 → 沿坡道滚下 → 落上跷跷板左臂端头,滚入挡壁凹槽被拦住 →
 *   球重压板(左臂下摆、右臂端头上顶) →
 *   右臂端头的"指形托架"(指+托板)从下方顶住闸门吊脚,随端头上行把闸门整体顶起 →
 *   闸门(吊在导轨间的门叶)抬升,小车通道打开 → 小车失去阻挡,沿斜坡车道冲向多米诺 →
 *   多米诺连锁右倒 → 末张推摆锤,锤回摆 → 锤头击铃(此刻才发声并翻转"营业/下班"牌)
 *
 * 能量来源:仅小球初始重力势能(+小车在斜坡上的势能,同样来自重力,开局静止由闸门扣住)。
 * 无弹簧、无隐形施力。所有关键事件均可通过碰撞对(pair)追溯。
 */
(function (root) {
  'use strict';
  const Matter = root.Matter || (typeof require === 'function' ? require('../lib/matter.min.js') : null);
  if (!Matter) throw new Error('Matter.js 未找到');

  const { Engine, Bodies, Body, Composite, Constraint, Events, Vector } = Matter;

  // ---------- 世界常量(像素,y 向下) ----------
  const CFG = {
    DT: 1000 / 120,
    FLOOR_Y: 620,
    WORLD: { x0: -60, y0: 80, x1: 1300, y1: 700 },

    ball: { r: 16, density: 0.02, friction: 0.05, frictionStatic: 0.5, restitution: 0.02 },

    // 进料坡道:球直接坐在坡道上,插销挡在坡下侧
    rail: { x0: 60, y0: 270, x1: 255, y1: 365, thickness: 10 },

    // 跷跷板:左长臂(接球)右短臂(顶闸门),初始左臂上翘 18°
    seesaw: {
      pivot: { x: 526, y: 470 },
      leftArm: 320, rightArm: 120, thickness: 14,
      startAngleDeg: 18,
            wallMid:   { dx: -230, h: 70, w: 8 }, // 中途挡壁(球着陆后 40px 内必被拦,任何臂姿态)
      wallFront: { dx: -170, h: 70, w: 8 }, // 内侧挡壁(兜底保险)
      tipLip: { dx: -314, h: 14, w: 8 },   // 臂端小挡沿(末态留住小球,闸门不回落)
      finger: { dx: 120, h: 20, w: 8 },        // 端头顶面的顶升指
      shelf: { dx: 116, hAbove: 32.5, w: 40, t: 6 }, // 托板(加宽:吊脚左滑被挡沿接住,不脱板)
      lip: { dx: 112, hAbove: 41.5, w: 6, t: 12 },    // 托板左端防滑挡沿
      lipR: { dx: 126, hAbove: 41.5, w: 6, t: 12 },   // 托板右端防滑挡沿
      density: 0.0012,
    },
        pedLip: { cx: 555.5, w: 8, top: 487.5, bottom: 620 }, // 左缘凸挡(出生预压 0.4px:确定性接触,无沉降无滑脱)

    // 闸门:吊在导轨间的门叶 + 左伸吊脚(吊脚与托板同为 18° 倾角,坐在托板上)
    gate: {
      leaf: { cx: 674, w: 10, top: 468, bottom: 599 },   // 门叶(挡住小车鼻)
      hanger: { cx: 674, w: 6, top: 300, bottom: 472 },  // 吊架(右面沿吊轨滑行,防撬)
      foot: { dx: 118, hAbove: 38.5, w: 18, t: 6 },        // 吊脚(坐在托板上)
      density: 0.006, friction: 0.1,
    },
    guides: [ // 静态吊轨(高处竖轨,门叶吊架沿其滑行;底部 460,小车通道 570+ 完全让开)
      { cx: 681, w: 8, top: 300, bottom: 460 },
    ],

    // 小车车道:斜坡托板(520,602)-(660,620),小车被闸门扣在坡上
    wedge: { x0: 585, y0: 556, x1: 700, y1: 620, t: 10 },
        hood: { cx: 315, cy: 334, w: 60, h: 8 },           // 着陆护罩(拦着陆反弹,飞行路径从下方通过)
    catchL: { cx: 260, w: 20, top: 530, bottom: 620 }, // 左臂接槽左块(臂端落入 V 槽)
    catchR: { cx: 302, w: 20, top: 536, bottom: 620 }, // 右接刀:臂止于绝对 ≈-14.5°,门叶升 ~8px=车顶擦拖高度
    cart: { cx: 635, wheelDx: 15, wheelR: 8, chassisW: 44, chassisH: 12, density: 0.004, wheelDensity: 0.005 },

    dominoes: { x0: 740, pitch: 32, count: 6, w: 12, h: 62, density: 0.0007, friction: 0.15 },

    // 摆锤:竖直微左倾,靠限位钉定住;末张多米诺推锤头,锤回摆击铃
    hammer: { pivot: { x: 924, y: 490 }, rodLen: 70, rodW: 10, headR: 18, headDist: 78, leanDeg: 0, headDensity: 0.003, rodDensity: 0.001 },
        bell: { x: 973.5, y: 590.7, r: 22 },
    gantry: { postCx: 1014, postW: 14, postTop: 482, beamY: 477, beamL: 924, beamR: 1028, beamT: 10 },

    baffle: { x: 706, y0: 560, y1: 620, w: 10 }, // 干预:小车与多米诺之间的挡板位
    lockBar: { cx: 658, cy: 460, w: 24, h: 8 },   // 干预:压梁(646-670×456-464,罩托板角且避开吊脚顶)

    sign: { x: 950, y: 150 }, // 指示牌(渲染层绘制,状态由敲铃事件驱动)
  };

  const STAGES = [
    { id: 'released',     label: '① 释放小球' },
    { id: 'ballOnSeesaw', label: '② 球落上跷跷板', cause: '碰撞:小球×跷跷板' },
    { id: 'tipped',       label: '③ 跷跷板翻转',   cause: '球的重量(板越过初始角)' },
    { id: 'gateLifting',  label: '④ 闸门被顶起',   cause: '接触:托板×闸门吊脚' },
    { id: 'gateOpen',     label: '⑤ 车道畅通',     cause: '闸门抬升≥14px' },
    { id: 'cartRolling',  label: '⑥ 小车启动',     cause: '闸门抬升后失去阻挡' },
    { id: 'cartPassed',   label: '⑦ 小车越过闸门' },
    { id: 'domino1',      label: '⑧ 多米诺启动',   cause: '碰撞:小车×多米诺#1' },
    { id: 'chain',        label: '⑨ 多米诺连锁',   cause: '多米诺间碰撞' },
    { id: 'hammer',       label: '⑩ 摆锤被推动',   cause: '碰撞:末张多米诺×锤头' },
    { id: 'bell',         label: '⑪ 铃被敲响',     cause: '碰撞:锤头×铃' },
    { id: 'sign',         label: '⑫ 指示牌切换"已下班"', cause: '敲铃事件' },
  ];

  function deg(x) { return x * 180 / Math.PI; }

  function createWorld(opts) {
    opts = opts || {};
    const gravityFactor = opts.gravityFactor != null ? opts.gravityFactor : 1;
    const releaseHeightFactor = opts.releaseHeightFactor != null ? opts.releaseHeightFactor : 1;

    const engine = Engine.create();
    engine.gravity.y = gravityFactor;
    engine.positionIterations = 10;
    engine.velocityIterations = 8;
    engine.constraintIterations = 10;
    const world = engine.world;

    const named = {};
    const log = [];
    const soundEvents = [];
    const contacts = new Set();
    const anomalies = [];
    const anomalySeen = new Set();
    const sim = { t: 0, released: false, locked: false, baffleIn: false, bellRung: false, signFlipped: false };
    const stageState = {};
    STAGES.forEach(s => stageState[s.id] = { done: false, t: null });

    const nowS = () => sim.t / 1000;
    function addLog(kind, msg) { log.push({ t: nowS(), kind, msg }); }
    function markStage(id, detail) {
      const st = stageState[id];
      if (st.done) return;
      st.done = true; st.t = nowS();
      const s = STAGES.find(s => s.id === id);
      addLog('milestone', '【' + s.label + '】' + (s.cause ? '依据:' + s.cause + '。' : '') + (detail || ''));
    }
    function anomaly(msg) {
      if (anomalySeen.has(msg)) return;
      anomalySeen.add(msg);
      anomalies.push({ t: nowS(), msg });
      addLog('anomaly', '⚠ 无因果事件:' + msg);
    }
    function relSpeed(pair) {
      const a = pair.bodyA, b = pair.bodyB;
      const va = a.isStatic ? { x: 0, y: 0 } : a.velocity;
      const vb = b.isStatic ? { x: 0, y: 0 } : b.velocity;
      return Vector.magnitude(Vector.sub(va, vb));
    }
    const nameOf = b => (b && b.label) ? b.label : '刚体';

    // ---------- 静态环境 ----------
    const floor = Bodies.rectangle(600, 820, 2400, 400, { isStatic: true, friction: 0.6, label: '地面' });
    const leftWall = Bodies.rectangle(-48, 360, 16, 620, { isStatic: true, label: '左墙' });
    const rightWall = Bodies.rectangle(1268, 360, 16, 620, { isStatic: true, label: '右墙' });

    // 进料坡道 + 释放插销
    const rl = CFG.rail;
    const railLen = Math.hypot(rl.x1 - rl.x0, rl.y1 - rl.y0);
    const railAng = Math.atan2(rl.y1 - rl.y0, rl.x1 - rl.x0);
    const rail = Bodies.rectangle((rl.x0 + rl.x1) / 2, (rl.y0 + rl.y1) / 2, railLen, rl.thickness,
      { isStatic: true, angle: railAng, friction: 0.05, label: '进料坡道' });
    const uRail = { x: Math.cos(railAng), y: Math.sin(railAng) };
    const nUp = { x: Math.sin(railAng), y: -Math.cos(railAng) }; // 坡道法线(向上)
    const s0 = 30 * releaseHeightFactor;
    const cBall = { x: rl.x0 + uRail.x * s0, y: rl.y0 + uRail.y * s0 };
    const startX = cBall.x + nUp.x * CFG.ball.r;
    const startY = cBall.y + nUp.y * CFG.ball.r;
    const latch = Bodies.rectangle(cBall.x + uRail.x * 12, cBall.y + uRail.y * 12,
      6, 30, { isStatic: true, angle: railAng, friction: 0.3, label: '释放插销' });

    // ---------- 跷跷板(板+挡壁+顶升指+托板+挡沿 复合体,支点约束) ----------
    const ss = CFG.seesaw;
    const ang0 = ss.startAngleDeg * Math.PI / 180;
    const u = { x: Math.cos(ang0), y: Math.sin(ang0) };       // 沿臂方向
    const n = { x: Math.sin(ang0), y: -Math.cos(ang0) };      // 臂面法线(向上)
    const centerOff = (ss.rightArm - ss.leftArm) / 2;
    const plankC = { x: ss.pivot.x + u.x * centerOff, y: ss.pivot.y + u.y * centerOff };
    const plankRect = Bodies.rectangle(plankC.x, plankC.y, ss.leftArm + ss.rightArm, ss.thickness,
      { angle: ang0, density: ss.density, label: '跷跷板' });
    function partAt(dx, hAbove, w, h) { // 臂坐标放置小构件:hAbove=中心线以上的高度
      return Bodies.rectangle(
        ss.pivot.x + u.x * dx + n.x * hAbove, ss.pivot.y + u.y * dx + n.y * hAbove,
        w, h, { angle: ang0, density: ss.density, label: '跷跷板' });
    }
    const wallMidRect = partAt(ss.wallMid.dx, ss.thickness / 2 + ss.wallMid.h / 2 - 3, ss.wallMid.w, ss.wallMid.h);
    const wallFrontRect = partAt(ss.wallFront.dx, ss.thickness / 2 + ss.wallFront.h / 2 - 3, ss.wallFront.w, ss.wallFront.h);
    const tipLipRect = partAt(ss.tipLip.dx, ss.thickness / 2 + ss.tipLip.h / 2 - 3, ss.tipLip.w, ss.tipLip.h);
    const fingerRect = partAt(ss.finger.dx, ss.thickness / 2 + ss.finger.h / 2, ss.finger.w, ss.finger.h);
    const shelfRect = partAt(ss.shelf.dx, ss.shelf.hAbove, ss.shelf.w, ss.shelf.t);
    const lipRect = partAt(ss.lip.dx, ss.lip.hAbove, ss.lip.w, ss.lip.t);
    const lipRRect = partAt(ss.lipR.dx, ss.lipR.hAbove, ss.lipR.w, ss.lipR.t);
    const plank = Body.create({
      parts: [plankRect, wallMidRect, wallFrontRect, tipLipRect, fingerRect, shelfRect, lipRect, lipRRect],
      friction: 0.1, density: ss.density, restitution: 0.02, frictionAir: 0.008, label: '跷跷板',
    });
    const pivotCon = Constraint.create({
      pointA: { x: ss.pivot.x, y: ss.pivot.y },
      bodyB: plank, pointB: { x: ss.pivot.x - plank.position.x, y: ss.pivot.y - plank.position.y },
      length: 0, stiffness: 0.9, damping: 0.02,
    });

    // 定位支柱:出生时托住右臂底面(球压上后右臂上抬,自然脱开)
    const pl = CFG.pedLip;
    const pedLip = Bodies.rectangle(pl.cx, (pl.top + pl.bottom) / 2, pl.w, pl.bottom - pl.top,
      { isStatic: true, friction: 0.3, label: '定位支柱' });
    // 左臂接槽:翻转到位后臂端落入 V 槽(板止于绝对 ≈-12°,托板保持小倾角,吊脚不打滑)
    function catchBlock(c) {
      return Bodies.rectangle(c.cx, (c.top + c.bottom) / 2, c.w, c.bottom - c.top,
        { isStatic: true, friction: 0.3, label: '翻转限位块' });
    }
    const hood = Bodies.rectangle(CFG.hood.cx, CFG.hood.cy, CFG.hood.w, CFG.hood.h,
      { isStatic: true, friction: 0.1, label: '着陆护罩' });
    const catchL = catchBlock(CFG.catchL);
    const catchR = catchBlock(CFG.catchR);

    // ---------- 闸门(门叶+吊脚 复合体,吊在导轨间,坐在托板上) ----------
    const gm = CFG.gate;
    const leaf = Bodies.rectangle(gm.leaf.cx, (gm.leaf.top + gm.leaf.bottom) / 2, gm.leaf.w, gm.leaf.bottom - gm.leaf.top,
      { density: gm.density, friction: gm.friction, frictionStatic: 0.05, restitution: 0, frictionAir: 0.004, label: '闸门' });
    const hanger = Bodies.rectangle(gm.hanger.cx, (gm.hanger.top + gm.hanger.bottom) / 2, gm.hanger.w, gm.hanger.bottom - gm.hanger.top,
      { density: gm.density, friction: gm.friction, frictionStatic: 0.05, restitution: 0, frictionAir: 0.004, label: '闸门' });
    const foot = Bodies.rectangle(
      ss.pivot.x + u.x * gm.foot.dx + n.x * gm.foot.hAbove,
      ss.pivot.y + u.y * gm.foot.dx + n.y * gm.foot.hAbove,
      gm.foot.w, gm.foot.t, { angle: ang0, density: gm.density, friction: gm.friction, label: '闸门' });
    const gate = Body.create({ parts: [leaf, hanger, foot], friction: gm.friction, restitution: 0, frictionAir: 0.004, label: '闸门' });
    const guideBodies = CFG.guides.map((g, i) => Bodies.rectangle(g.cx, (g.top + g.bottom) / 2, g.w, g.bottom - g.top,
      { isStatic: true, label: '闸门导轨' + (i + 1) }));

    // ---------- 车道斜坡 + 小车 ----------
    const wg = CFG.wedge;
    const wedgeLen = Math.hypot(wg.x1 - wg.x0, wg.y1 - wg.y0);
    const wedgeAng = Math.atan2(wg.y1 - wg.y0, wg.x1 - wg.x0);
    const wu = { x: Math.cos(wedgeAng), y: Math.sin(wedgeAng) };
    const wedgeMid = { x: (wg.x0 + wg.x1) / 2 - wu.y * wg.t / 2, y: (wg.y0 + wg.y1) / 2 + wu.x * wg.t / 2 };
    const wedge = Bodies.rectangle(wedgeMid.x, wedgeMid.y, wedgeLen, wg.t,
      { isStatic: true, angle: wedgeAng, friction: 0.4, label: '车道斜坡' });
    const ct = CFG.cart;
    function wheelCenterY(x) { // 车轮落在斜坡面上
      const t = (x - wg.x0) / (wg.x1 - wg.x0);
      const sy = wg.y0 + (wg.y1 - wg.y0) * t;
      return sy - ct.wheelR;
    }
    // 轮距沿俯仰轴线放置,约束锚点与轮心精确重合(零出生应变)
    const rearC = { x: ct.cx - ct.wheelDx * Math.cos(wedgeAng), y: wheelCenterY(ct.cx - ct.wheelDx * Math.cos(wedgeAng)) };
    const frontC = { x: ct.cx + ct.wheelDx * Math.cos(wedgeAng), y: wheelCenterY(ct.cx + ct.wheelDx * Math.cos(wedgeAng)) };
    const axleMid = { x: (rearC.x + frontC.x) / 2, y: (rearC.y + frontC.y) / 2 };
    const chassisOff = ct.wheelR + 3 + ct.chassisH / 2; // +3: 俯仰出生时底盘后角不得切入后轮顶
    const wheelL = Bodies.circle(rearC.x, rearC.y, ct.wheelR,
      { density: ct.wheelDensity, friction: 0.03, frictionStatic: 0.5, frictionAir: 0.0005, label: '车轮' });
    const wheelR2 = Bodies.circle(frontC.x, frontC.y, ct.wheelR,
      { density: ct.wheelDensity, friction: 0.03, frictionStatic: 0.5, frictionAir: 0.0005, label: '车轮' });
    const chassis = Bodies.rectangle(
      axleMid.x + chassisOff * Math.sin(wedgeAng), axleMid.y - chassisOff * Math.cos(wedgeAng),
      ct.chassisW, ct.chassisH, { angle: wedgeAng, density: ct.density, friction: 0.2, frictionAir: 0.0005, label: '小车' });
    const axleL = Constraint.create({ bodyA: wheelL, pointA: { x: 0, y: 0 }, bodyB: chassis, pointB: { x: -ct.wheelDx, y: chassisOff }, length: 0, stiffness: 0.9, damping: 0.1 });
    const axleR = Constraint.create({ bodyA: wheelR2, pointA: { x: 0, y: 0 }, bodyB: chassis, pointB: { x: ct.wheelDx, y: chassisOff }, length: 0, stiffness: 0.9, damping: 0.1 });

    // ---------- 多米诺 ----------
    const dm = CFG.dominoes;
    const dominoes = [];
    for (let i = 0; i < dm.count; i++) {
      dominoes.push(Bodies.rectangle(dm.x0 + dm.pitch * i, CFG.FLOOR_Y - dm.h / 2, dm.w, dm.h,
        { density: dm.density, friction: dm.friction, frictionStatic: 0.6, restitution: 0.01, label: '多米诺#' + (i + 1) }));
    }

    // ---------- 摆锤 + 限位钉 + 铃 + 龙门架 ----------
    const hm = CFG.hammer;
    const lean = hm.leanDeg * Math.PI / 180;
    const rodC = { x: hm.pivot.x, y: hm.pivot.y + hm.rodLen / 2 };
    const headC = { x: hm.pivot.x, y: hm.pivot.y + hm.headDist };
    const rod = Bodies.rectangle(rodC.x, rodC.y, hm.rodW, hm.rodLen, { angle: 0, density: hm.rodDensity, label: '锤臂' });
    const head = Bodies.circle(headC.x, headC.y, hm.headR, { density: hm.headDensity, friction: 0.3, label: '锤头' });
    const hammer = Body.create({ parts: [rod, head], friction: 0.3, restitution: 0.3, frictionAir: 0.0008, label: '摆锤' });
    Body.rotate(hammer, lean, hm.pivot); // 整体绕支点倾斜(复刚体角度从竖直起算,避免出生自摆)
    const hammerCon = Constraint.create({
      pointA: { x: hm.pivot.x, y: hm.pivot.y },
      bodyB: hammer, pointB: { x: hm.pivot.x - hammer.position.x, y: hm.pivot.y - hammer.position.y },
      length: 0, stiffness: 0.12, damping: 0.05,
    });
    const bell = Bodies.circle(CFG.bell.x, CFG.bell.y, CFG.bell.r, { isStatic: true, restitution: 0.6, label: '铃' });
    const gt = CFG.gantry;
    const gantryPost = Bodies.rectangle(gt.postCx, (gt.postTop + CFG.FLOOR_Y) / 2, gt.postW, CFG.FLOOR_Y - gt.postTop,
      { isStatic: true, label: '龙门架' });
    const gantryBeam = Bodies.rectangle((gt.beamL + gt.beamR) / 2, gt.beamY, gt.beamR - gt.beamL, gt.beamT,
      { isStatic: true, label: '龙门架' });

    const ball = Bodies.circle(startX, startY, CFG.ball.r,
      { density: CFG.ball.density, friction: CFG.ball.friction, frictionStatic: CFG.ball.frictionStatic, restitution: CFG.ball.restitution, frictionAir: 0.0004, label: '小球' });

    Composite.add(world, [floor, leftWall, rightWall, rail, latch, pedLip, hood, catchL, catchR,
      plank, pivotCon, gate, ...guideBodies, wedge, chassis, wheelL, wheelR2, axleL, axleR,
      ...dominoes, hammer, hammerCon, bell, gantryPost, gantryBeam, ball]);

    named.ball = ball; named.plank = plank; named.gate = gate; named.bell = bell;
    named.cart = { chassis, wheels: [wheelL, wheelR2] };
    named.dominoes = dominoes; named.hammer = hammer;
    named.decor = { latch, rail, pedLip, hood, catchL, catchR, wedge, guides: guideBodies, gantryPost, gantryBeam, floor, leftWall, rightWall };
    named.lockBlock = null; named.baffle = null;

    const base = {
      gateY: gate.position.y, gateYRaw: gate.position.y, gateYSettled: false,
      plankAngle0: ang0,
      cartX0: chassis.position.x,
      hammerAngle0: hammer.angle,
      ballStartY: startY,
      releaseHeightFactor, gravityFactor,
    };

    addLog('sys', '世界已构建。重力=' + gravityFactor.toFixed(2) + 'g,释放高度=' + (releaseHeightFactor * 100).toFixed(1) + '%。能量来源:小球重力势能+车道斜坡上小车的势能(同样来自重力,开局被闸门扣住),无弹簧无隐形施力。');

    // ---------- 碰撞事件(声音/关键因果唯一来源) ----------
    const lastThud = { t: -1e9 };
    const lastSnd = { knock: -1e9, tick: -1e9 };
    Events.on(engine, 'collisionStart', function (ev) {
      for (const pair of ev.pairs) {
        const a = pair.bodyA, b = pair.bodyB;
        const ka = nameOf(a), kb = nameOf(b);
        const key = ka + '×' + kb;
        const dv = relSpeed(pair);
        if (dv > 0.8) addLog('contact', '碰撞 ' + key + ' |Δv|=' + dv.toFixed(2));
        const has = n => ka === n || kb === n;
        const other = n => (ka === n) ? kb : (kb === n ? ka : null);

        if (has('跷跷板') && has('小球')) contacts.add('ballPlank');
        if (has('跷跷板') && has('闸门')) contacts.add('plankGate');
        if (ka.indexOf('多米诺') === 0 || kb.indexOf('多米诺') === 0) contacts.add('dominoTouched');
        if (has('锤头') && has('铃')) contacts.add('hammerBell');

        // —— 声音:只在真实碰撞回调中产生 ——
        if (has('锤头') && has('铃')) {
          onBellStruck(dv);
        } else if (ka.indexOf('多米诺') === 0 || kb.indexOf('多米诺') === 0) {
          const o = (ka.indexOf('多米诺') === 0) ? kb : ka;
          if (dv > 1.0 && sim.t - lastSnd.tick > 120 && (o.indexOf('多米诺') === 0 || o === '地面' || o === '小车' || o === '锤头')) {
            lastSnd.tick = sim.t;
            soundEvents.push({ t: nowS(), type: 'tick', gain: Math.min(1, dv / 7), cause: key });
          }
        } else if (ka === '小车' || kb === '小车') {
          const o = other('小车');
          if (dv > 0.8 && sim.t - lastSnd.knock > 120 && o && (o.indexOf('多米诺') === 0 || o === '挡板' || o === '锁定压梁')) {
            lastSnd.knock = sim.t;
            soundEvents.push({ t: nowS(), type: 'knock', gain: Math.min(1, dv / 6), cause: key });
          }
        } else if (has('小球')) {
          if (dv > 2.5 && sim.t - lastThud.t > 150) {
            lastThud.t = sim.t;
            soundEvents.push({ t: nowS(), type: 'thud', gain: Math.min(1, dv / 10), cause: key });
          }
        }

        // —— 越链检测:小球不应接触到下游装置 ——
        if (has('小球')) {
          const o = other('小球');
          if (o && o.indexOf('多米诺') === 0) anomaly('小球直接接触 ' + o + '(绕过跷跷板/闸门/小车)');
          if (o === '锤头' || o === '铃' || o === '摆锤') anomaly('小球直接接触 ' + o + '(绕过因果链)');
          if (o === '小车') anomaly('小球直接接触小车(绕过闸门环节)');
        }
      }
    });

    function onBellStruck(dv) {
      if (!sim.bellRung) {
        sim.bellRung = true;
        markStage('bell', '|Δv|=' + dv.toFixed(2) + ',铃声与碰撞同帧调度(时差 0.00ms)。');
        sim.signFlipped = true;
        markStage('sign', '指示牌由「营业中」切换为「已下班」。');
        addLog('sign', '桌面指示牌翻转:营业中 → 已下班(由敲铃事件驱动)。');
      } else {
        addLog('contact', '摆锤回摆再次触铃(物理重振)。');
      }
      soundEvents.push({ t: nowS(), type: 'bell', gain: Math.min(1, 0.35 + dv / 6), cause: '锤头×铃' });
    }

    // ---------- 里程碑采样(每步依据刚体真实状态) ----------
    function sample() {
      const pa = plank.angle;
      if (contacts.has('ballPlank')) markStage('ballOnSeesaw');
      if (stageState.ballOnSeesaw.done && pa < base.plankAngle0 - 0.035) markStage('tipped', '板角 ' + deg(base.plankAngle0).toFixed(1) + '°→' + deg(pa).toFixed(1) + '°');
      if (!base.gateYSettled && contacts.has('ballPlank')) { base.gateY = gate.position.y; base.gateYSettled = true; }
      const rise = base.gateYSettled ? base.gateY - gate.position.y : 0;
      if (rise > 1.5) {
        if (!contacts.has('plankGate')) anomaly('闸门抬升但未见 托板×闸门 接触');
        else markStage('gateLifting', '闸门抬升 ' + rise.toFixed(1) + 'px');
      }
      if (rise > 10) markStage('gateOpen', '闸门抬升 ' + rise.toFixed(1) + 'px,车道畅通');
      if (stageState.gateOpen.done && chassis.position.x > base.cartX0 + 12) {
        if (!stageState.gateLifting.done) anomaly('小车移动但闸门从未抬升');
        else markStage('cartRolling');
      }
      if (stageState.gateOpen.done && chassis.position.x + ct.chassisW / 2 > 686) markStage('cartPassed');
      if (Math.abs(dominoes[0].angle) > 0.6) {
        if (!stageState.cartPassed.done) anomaly('多米诺#1 倒下但小车从未越过闸门');
        markStage('domino1');
      }
      if (Math.abs(dominoes[3].angle) > 0.6) markStage('chain');
      const swing = base.hammerAngle0 - hammer.angle;
      if (swing > 0.15) {
        if (!stageState.domino1.done && !contacts.has('dominoTouched')) anomaly('摆锤自行摆动但无多米诺接触史');
        markStage('hammer', '摆角 ' + deg(swing).toFixed(1) + '°');
      }
      if (sim.bellRung && !stageState.hammer.done) anomaly('铃被敲响但摆锤从未被推动');
    }

    // ---------- 对外动作 ----------
    const actions = {
      release() {
        if (sim.released) return false;
        sim.released = true;
        Composite.remove(world, latch);
        markStage('released', '拔起释放插销,小球仅受重力。');
        return true;
      },
      lockSeesaw() {
        if (sim.locked) return false;
        if (stageState.ballOnSeesaw.done) {
          addLog('action', '【干预】锁定跷跷板被拒:球已落板,杠杆已受力(干预节点:球到达跷跷板之前)。');
          return false;
        }
        sim.locked = true;
        const lb = CFG.lockBar;
        const blk = Bodies.rectangle(lb.cx, lb.cy, lb.w, lb.h, { isStatic: true, friction: 0.3, label: '锁定压梁' });
        Composite.add(world, blk);
        named.lockBlock = blk;
        addLog('action', '【干预】锁定跷跷板:顶升指上方加入压梁(x=' + lb.cx + '),端头无法继续上顶。执行节点:球到达跷跷板之前。');
        return true;
      },
      insertBaffle() {
        if (sim.baffleIn) return false;
        if (chassis.position.x + ct.chassisW / 2 > CFG.baffle.x - 20) {
          addLog('action', '【干预】插入挡板请求被拒:小车已越过插入点(x=' + chassis.position.x.toFixed(0) + '),物理上无法再拦截。');
          return false;
        }
        sim.baffleIn = true;
        const bf = CFG.baffle;
        const b = Bodies.rectangle(bf.x + bf.w / 2, (bf.y0 + bf.y1) / 2, bf.w, bf.y1 - bf.y0,
          { isStatic: true, friction: 0.4, label: '挡板' });
        Composite.add(world, b);
        named.baffle = b;
        addLog('action', '【干预】在小车与多米诺区之间(x=' + bf.x + ')插入挡板。小车已过闸门=' + stageState.cartPassed.done);
        return true;
      },
      setGravityFactor(f) {
        engine.gravity.y = f;
        base.gravityFactor = f;
        addLog('action', '【干预】重力调整为 ' + f.toFixed(2) + 'g(即时生效)。');
      },
    };

    function step() {
      Engine.update(engine, CFG.DT);
      sim.t += CFG.DT;
      sample();
    }

    function summary() {
      const done = STAGES.filter(s => stageState[s.id].done);
      const last = done.length ? done[done.length - 1] : null;
      const bellEvts = soundEvents.filter(e => e.type === 'bell');
      return {
        t: nowS(), bellRung: sim.bellRung, signFlipped: sim.signFlipped,
        anomalies: anomalies.slice(), anomalyCount: anomalies.length,
        stages: stageState,
        stopStage: last ? last.label : '未开始',
        plankAngleDeg: deg(plank.angle + base.plankAngle0),
        gateRise: base.gateY - gate.position.y,
        cartX: chassis.position.x,
        dominoAngles: dominoes.map(d => deg(d.angle)),
        ballX: ball.position.x, ballY: ball.position.y,
        hammerSwingDeg: deg(base.hammerAngle0 - hammer.angle),
        bellLatencyMs: 0, // 声音在碰撞回调内同帧调度
        bellCount: bellEvts.length,
        soundEvents: soundEvents.slice(), log: log.slice(),
      };
    }

    return { engine, world, CFG, base, sim, stageState, STAGES, bodies: named, actions, step, summary, log, soundEvents, anomalies, state: sim };
  }

  const API = { createWorld, CFG, STAGES };
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  root.RGWorld = API;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/*
 * render.js — 弹珠下班装置 · 画布渲染(纯 Canvas2D,支持整体一镜 + 滚轮/拖拽缩放)
 */
(function (root) {
  'use strict';

  const WORLD = { x0: -60, y0: 60, x1: 1300, y1: 700 };

  const THEME = {
    bg0: '#1b2230', bg1: '#232c3d',
    floor: '#3d3227', floorTop: '#57493a',
    metal: '#8d99ae', metalDark: '#5c677d',
    wood: '#a97c50', woodDark: '#7d5a3a',
    accent: '#e0a458', danger: '#c9553d',
    ball: '#e8c15a', steel: '#b8c0cc',
    domino: '#e6e2d8', dominoEdge: '#b9b3a5',
    bell: '#d4af37', signOn: '#37b26c', signOff: '#c9553d',
    latch: '#c9553d',
  };

  function createRenderer(canvas, world) {
    const ctx = canvas.getContext('2d');
    const view = { scale: 1, tx: 0, ty: 0, dragging: false, lx: 0, ly: 0 };

    function fit() {
      canvas.width = canvas.clientWidth * (window.devicePixelRatio || 1);
      canvas.height = canvas.clientHeight * (window.devicePixelRatio || 1);
      view.scale = Math.min(canvas.width / (WORLD.x1 - WORLD.x0), canvas.height * 1.02 / (WORLD.y1 - WORLD.y0));
      view.tx = 0; view.ty = 0;
    }
    fit();
    window.addEventListener('resize', fit);

    function toScreen(x, y) {
      return [x * view.scale + view.tx, y * view.scale + view.ty];
    }
    function drawPoly(vs, fill, stroke, lw) {
      ctx.beginPath();
      vs.forEach((v, i) => {
        const [sx, sy] = toScreen(v.x, v.y);
        if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
      });
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
    }
    function drawCircle(x, y, r, fill, stroke, lw) {
      const [sx, sy] = toScreen(x, y);
      ctx.beginPath();
      ctx.arc(sx, sy, r * view.scale, 0, Math.PI * 2);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
    }
    function drawBody(body, fill, stroke, lw) {
      if (body.parts.length > 1) {
        body.parts.slice(1).forEach(pt => drawPoly(pt.vertices, fill, stroke, lw));
      } else if (body.circleRadius) {
        drawCircle(body.position.x, body.position.y, body.circleRadius, fill, stroke, lw);
      } else {
        drawPoly(body.vertices, fill, stroke, lw);
      }
    }

    function drawBackdrop() {
      const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
      g.addColorStop(0, THEME.bg0); g.addColorStop(1, THEME.bg1);
      ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height);
      // 背景网格
      ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 1;
      for (let gx = WORLD.x0; gx < WORLD.x1; gx += 50) {
        const [sx] = toScreen(gx, 0); ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, canvas.height); ctx.stroke();
      }
      for (let gy = WORLD.y0; gy < WORLD.y1; gy += 50) {
        const [, sy] = toScreen(0, gy); ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(canvas.width, sy); ctx.stroke();
      }
    }

    function drawStatic(b) {
      const L = b.label;
      if (L === '地面') drawBody(b, THEME.floor, THEME.floorTop, 2);
      else if (L === '进料坡道') drawBody(b, THEME.wood, THEME.woodDark, 2);
      else if (L === '车道斜坡') drawBody(b, THEME.wood, THEME.woodDark, 2);
      else if (L.startsWith('闸门导轨')) drawBody(b, THEME.metalDark, THEME.metal, 1.5);
      else if (L === '龙门架') drawBody(b, THEME.metalDark, THEME.metal, 1.5);
      else if (L === '定位支柱' || L === '翻转限位块') drawBody(b, '#4a5568', THEME.metalDark, 1.5);
      else if (L === '着陆护罩') drawBody(b, 'rgba(90,110,140,0.35)', THEME.metalDark, 1.5);
      else drawBody(b, THEME.metalDark, THEME.metal, 1.2);
    }

    function drawSign() {
      const sim = world.sim;
      const [sx, sy] = toScreen(world.CFG.sign.x, world.CFG.sign.y);
      const w = 120 * view.scale, h = 78 * view.scale;
      ctx.save();
      ctx.translate(sx, sy);
      // 挂杆
      ctx.fillStyle = THEME.metalDark;
      ctx.fillRect(-w / 2 - 10 * view.scale, -h / 2 - 8 * view.scale, w + 20 * view.scale, 6 * view.scale);
      // 牌面(翻转动画:翻转换向时压缩宽度)
      const flip = sim.signFlipped;
      const t = Math.min(1, (world.sim.t - (world.stageState.bell.t || 0)) * 3);
      const squeeze = flip ? Math.abs(Math.cos(Math.min(1, t) * Math.PI)) : 1;
      ctx.fillStyle = '#2a3140';
      ctx.fillRect(-w / 2, -h / 2, w, h);
      ctx.fillStyle = flip ? THEME.signOff : THEME.signOn;
      ctx.fillRect(-w / 2 * squeeze, -h / 2 + 4 * view.scale, w * squeeze, h - 8 * view.scale);
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.max(10, 20 * view.scale * squeeze)}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      if (squeeze > 0.35) ctx.fillText(flip ? '已下班' : '营业中', 0, 0);
      ctx.restore();
    }

    function drawCart() {
      const cart = world.bodies.cart;
      // 车轮
      cart.wheels.forEach(wh => {
        drawCircle(wh.position.x, wh.position.y, wh.circleRadius, '#2f3640', THEME.metal, 2);
        // 辐条(可视化转动)
        const [sx, sy] = toScreen(wh.position.x, wh.position.y);
        ctx.save(); ctx.translate(sx, sy); ctx.rotate(wh.angle);
        ctx.strokeStyle = THEME.metal; ctx.lineWidth = 1.5;
        for (let k = 0; k < 2; k++) {
          ctx.beginPath(); ctx.moveTo(-wh.circleRadius * view.scale * 0.8, 0); ctx.lineTo(wh.circleRadius * view.scale * 0.8, 0); ctx.stroke();
          ctx.rotate(Math.PI / 2);
        }
        ctx.restore();
      });
      // 车身(沿俯仰角)
      const b = cart.chassis;
      ctx.save();
      const [sx, sy] = toScreen(b.position.x, b.position.y);
      ctx.translate(sx, sy); ctx.rotate(b.angle);
      const w = 44 * view.scale, h = 14 * view.scale;
      ctx.fillStyle = THEME.accent; ctx.fillRect(-w / 2, -h, w, h);
      ctx.fillStyle = THEME.woodDark; ctx.fillRect(-w / 2 + 4 * view.scale, -h - 8 * view.scale, w - 8 * view.scale, 8 * view.scale);
      ctx.strokeStyle = THEME.metalDark; ctx.lineWidth = 1.5;
      ctx.strokeRect(-w / 2, -h, w, h);
      ctx.restore();
    }

    function drawHammer() {
      const h = world.bodies.hammer;
      // 支点
      const pv = world.CFG.hammer.pivot;
      drawCircle(pv.x, pv.y, 5, THEME.metalDark, THEME.metal, 2);
      drawBody(h, THEME.steel, THEME.metalDark, 2);
      // 锤头高光
      const head = h.parts[h.parts.length - 1];
      drawCircle(head.position.x - 4, head.position.y - 4, 5, 'rgba(255,255,255,0.25)');
    }

    function drawBell() {
      const b = world.bodies.bell;
      const [sx, sy] = toScreen(b.position.x, b.position.y);
      const r = b.circleRadius * view.scale;
      // 铃架
      ctx.fillStyle = THEME.metalDark;
      ctx.fillRect(sx - 3 * view.scale, sy - r - 30 * view.scale, 6 * view.scale, r + 30 * view.scale);
      drawCircle(sx, sy - r - 30 * view.scale, 4 * view.scale, THEME.metalDark);
      // 铃体
      ctx.beginPath();
      ctx.moveTo(sx - r * 0.95, sy + r * 0.8);
      ctx.quadraticCurveTo(sx - r, sy - r, sx, sy - r);
      ctx.quadraticCurveTo(sx + r, sy - r, sx + r * 0.95, sy + r * 0.8);
      ctx.closePath();
      const g = ctx.createLinearGradient(sx - r, 0, sx + r, 0);
      g.addColorStop(0, '#f0d060'); g.addColorStop(0.5, THEME.bell); g.addColorStop(1, '#a8862a');
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = '#8a6d1f'; ctx.lineWidth = 2; ctx.stroke();
      // 铃舌
      ctx.beginPath(); ctx.arc(sx, sy + r * 0.95, 3.5 * view.scale, 0, Math.PI * 2);
      ctx.fillStyle = THEME.metalDark; ctx.fill();
    }

    function drawBall() {
      const b = world.bodies.ball;
      drawCircle(b.position.x, b.position.y, b.circleRadius, THEME.ball, '#8a6d1f', 2);
      drawCircle(b.position.x - 5, b.position.y - 5, b.circleRadius * 0.3, 'rgba(255,255,255,0.5)');
    }

    function drawGlow(ringT) {
      if (ringT == null) return;
      const dt = world.sim.t / 1000 - ringT;
      if (dt < 0 || dt > 0.8) return;
      const b = world.bodies.bell;
      const [sx, sy] = toScreen(b.position.x, b.position.y);
      const a = (1 - dt / 0.8) * 0.5;
      ctx.beginPath(); ctx.arc(sx, sy, b.circleRadius * view.scale * (1.2 + dt * 2.2), 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,215,80,${a})`; ctx.lineWidth = 6 * view.scale; ctx.stroke();
    }

    function draw() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      drawBackdrop();
      const D = world.bodies.decor;
      // 后景静态
      drawStatic(D.floor); drawStatic(D.rail); drawStatic(D.wedge);
      drawStatic(D.pedLip); drawStatic(D.catchL); drawStatic(D.catchR);
      drawStatic(D.hood); drawStatic(D.gantryPost); drawStatic(D.gantryBeam);
      D.guides.forEach(g => drawStatic(g));
      // 跷跷板(含挡壁/托板/指)
      drawBody(world.bodies.plank, THEME.wood, THEME.woodDark, 2);
      // 闸门
      drawBody(world.bodies.gate, '#c9553dcc', THEME.danger, 2);
      // 小车 / 多米诺 / 摆锤 / 铃
      drawCart();
      world.bodies.dominoes.forEach((d, i) => {
        drawBody(d, i % 2 ? '#efece2' : THEME.domino, THEME.dominoEdge, 1.5);
      });
      drawHammer();
      drawBell();
      drawGlow(world.stageState.bell.t);
      // 小球最上层
      drawBall();
      // 插销(未释放时)
      if (world.bodies.decor.latch && world.bodies.decor.latch.parent) drawBody(world.bodies.decor.latch, THEME.latch, '#8a3a2a', 1.5);
      else if (world.bodies.decor.latch) drawBody(world.bodies.decor.latch, THEME.latch, '#8a3a2a', 1.5);
      // 干预物
      if (world.bodies.lockBlock) drawBody(world.bodies.lockBlock, THEME.danger, '#8a3a2a', 1.5);
      if (world.bodies.baffle) drawBody(world.bodies.baffle, THEME.danger, '#8a3a2a', 1.5);
      // 指示牌
      drawSign();
      // 标注
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.font = `${12 * view.scale}px sans-serif`;
      ctx.textAlign = 'left';
      const labels = [
        ['坡道', 90, 250], ['跷跷板', 400, 420], ['闸门', 655, 430],
        ['小车', 630, 540], ['多米诺', 790, 530], ['摆锤', 900, 430], ['铃', 985, 520],
      ];
      labels.forEach(([txt, x, y]) => {
        const [sx, sy] = toScreen(x, y);
        ctx.fillText(txt, sx, sy);
      });
    }

    // 交互:滚轮缩放 + 拖拽平移
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
      const my = (e.clientY - rect.top) * (canvas.height / rect.height);
      view.tx = mx - (mx - view.tx) * factor;
      view.ty = my - (my - view.ty) * factor;
      view.scale *= factor;
    }, { passive: false });
    canvas.addEventListener('mousedown', e => { view.dragging = true; view.lx = e.clientX; view.ly = e.clientY; });
    window.addEventListener('mouseup', () => { view.dragging = false; });
    window.addEventListener('mousemove', e => {
      if (!view.dragging) return;
      const k = canvas.width / canvas.getBoundingClientRect().width;
      view.tx += (e.clientX - view.lx) * k;
      view.ty += (e.clientY - view.ly) * k;
      view.lx = e.clientX; view.ly = e.clientY;
    });
    canvas.addEventListener('dblclick', fit);

    return { draw, fit };
  }

  const API = { createRenderer, WORLD };
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  root.RGRender = API;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/*
 * audio.js — 碰撞驱动音效(WebAudio)
 * 只消费 world.soundEvents(由真实碰撞回调产生),与碰撞同帧调度:
 *   bell  → 金属铃(基频+非谐分音,指数衰减)
 *   tick  → 多米诺脆响(短噪声脉冲+高频衰减)
 *   knock → 木击(低频正弦短促)
 *   thud  → 小球闷响(低频正弦+噪声)
 */
(function (root) {
  'use strict';

  function createAudio() {
    let ctx = null;
    let master = null;
    let enabled = true;

    function ensure() {
      if (!ctx) {
        const AC = root.AudioContext || root.webkitAudioContext;
        if (!AC) { enabled = false; return null; }
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.5;
        master.connect(ctx.destination);
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }

    function bellSound(gain) {
      const t0 = ctx.currentTime;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.6 * gain, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.2);
      g.connect(master);
      // 非谐分音(铃)
      [[1, 1], [2.76, 0.55], [5.4, 0.24], [8.9, 0.1]].forEach(([ratio, amp]) => {
        const o = ctx.createOscillator();
        o.type = 'sine';
        o.frequency.value = 620 * ratio;
        const og = ctx.createGain();
        og.gain.value = amp;
        o.connect(og); og.connect(g);
        o.start(t0); o.stop(t0 + 2.2);
      });
    }

    function clickSound(gain, freq, dur, type) {
      const t0 = ctx.currentTime;
      const o = ctx.createOscillator();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, t0);
      o.frequency.exponentialRampToValueAtTime(freq * 0.5, t0 + dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(gain * 0.25, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0 + dur);
    }

    function thudSound(gain, freq, dur) {
      const t0 = ctx.currentTime;
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(freq, t0);
      o.frequency.exponentialRampToValueAtTime(freq * 0.4, t0 + dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(gain * 0.4, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0 + dur);
    }

    return {
      drain(events) { // 每帧调用,消费自上次以来的事件
        if (!enabled) return;
        if (!events.length) return;
        if (!ensure()) return;
        events.forEach(ev => {
          const g = ev.gain != null ? ev.gain : 0.5;
          if (ev.type === 'bell') bellSound(g);
          else if (ev.type === 'tick') clickSound(g, 1400, 0.06, 'square');
          else if (ev.type === 'knock') thudSound(g, 180, 0.09);
          else if (ev.type === 'thud') thudSound(g, 120, 0.12);
        });
      },
      setEnabled(v) {
        enabled = v;
        if (v) ensure();
        else if (master) master.gain.value = 0;
        if (v && master) master.gain.value = 0.5;
      },
      reset() { /* 重置无需清理:一次性节点自然结束 */ },
      unlock() { ensure(); },
    };
  }

  const API = { createAudio };
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  root.RGAudio = API;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/*
 * app.js — 主控:固定步长物理循环 / 干预按钮 / 事件日志 / 诊断 / 音频调度
 */
(function () {
  'use strict';
  const { createWorld, CFG, STAGES } = RGWorld;
  const canvas = document.getElementById('stage');
  const audio = RGAudio.createAudio();
  let world = null;
  let renderer = null;
  let running = true;
  let lastTs = null;
  let acc = 0;
  const DT = CFG.DT;

  const $ = id => document.getElementById(id);
  const el = {
    chipStage: $('chip-stage'), chipGravity: $('chip-gravity'), chipClock: $('chip-clock'),
    stop: $('diag-stop'), anomaly: $('diag-anomaly'), latency: $('diag-latency'),
    bell: $('diag-bell'), gate: $('diag-gate'), cart: $('diag-cart'),
    log: $('log'), sign: $('sign-float'),
    pause: $('btn-pause'), sound: $('btn-sound'),
    release: $('btn-release'), lock: $('btn-lock'), baffle: $('btn-baffle'),
    gravity: $('btn-gravity'), h095: $('btn-h095'), h105: $('btn-h105'),
    reset: $('btn-reset'),
  };

  function logLine(e) {
    const div = document.createElement('div');
    div.className = 'line ' + e.kind;
    div.innerHTML = `<span class="t">${e.t.toFixed(2)}s</span>${e.msg}`;
    el.log.appendChild(div);
    while (el.log.children.length > 400) el.log.removeChild(el.log.firstChild);
    el.log.scrollTop = el.log.scrollHeight;
  }

  function buildWorld(opts) {
    world = createWorld(Object.assign({ gravityFactor: 1, releaseHeightFactor: 1 }, opts || {}));
    renderer = RGRender.createRenderer(canvas, world);
    el.log.innerHTML = '';
    world._logShown = 0;
    updatePanels(true);
  }

  function updatePanels(force) {
    const s = world.summary();
    el.chipStage.textContent = '环节:' + s.stopStage;
    el.chipGravity.textContent = '重力:' + world.base.gravityFactor.toFixed(2) + 'g';
    el.chipClock.textContent = 't = ' + s.t.toFixed(2) + 's';
    el.stop.textContent = s.stopStage;
    el.anomaly.textContent = s.anomalyCount + (s.anomalyCount ? ' ⚠' : '');
    el.anomaly.style.color = s.anomalyCount ? 'var(--bad)' : 'var(--text)';
    el.bell.textContent = String(s.bellCount);
    el.gate.textContent = s.gateRise.toFixed(1) + ' px';
    el.cart.textContent = (s.cartX - world.base.cartX0).toFixed(0) + ' px';
    el.sign.textContent = s.signFlipped ? '已下班' : '营业中';
    el.sign.classList.toggle('off', s.signFlipped);
    // 新日志(增量,绝不重复)
    if (world._logShown == null) world._logShown = 0;
    while (world.log.length > world._logShown) {
      logLine(world.log[world._logShown]);
      world._logShown++;
    }
    // 按钮可用性(干预节点)
    el.release.disabled = world.state.released;
    el.lock.disabled = world.state.locked || world.stageState.ballOnSeesaw.done;
    el.baffle.disabled = world.state.baffleIn || (world.bodies.cart.chassis.position.x + 22 > CFG.baffle.x - 20);
    el.gravity.disabled = world.base.gravityFactor <= 0.5;
  }

  function frame(ts) {
    requestAnimationFrame(frame);
    if (lastTs == null) { lastTs = ts; return; }
    let dt = Math.min(50, ts - lastTs);
    lastTs = ts;
    if (running) {
      acc += dt;
      const before = world.soundEvents.length;
      while (acc >= DT) { world.step(); acc -= DT; }
      const newEvents = world.soundEvents.slice(before);
      audio.drain(newEvents);
    }
    renderer.draw();
    updatePanels(false);
  }

  function startScenario(opts, autoRelease) {
    buildWorld(opts);
    world._logShown = world.log.length;
    running = true;
    el.pause.textContent = '暂停';
    lastTs = null; acc = 0;
    if (autoRelease) world.actions.release();
    updatePanels(true);
  }

  // —— 按钮 ——
  el.release.addEventListener('click', () => {
    audio.unlock();
    world.actions.release();
    updatePanels(true);
  });
  el.lock.addEventListener('click', () => { world.actions.lockSeesaw(); updatePanels(true); });
  el.baffle.addEventListener('click', () => { world.actions.insertBaffle(); updatePanels(true); });
  el.gravity.addEventListener('click', () => { world.actions.setGravityFactor(0.5); updatePanels(true); });
  el.h095.addEventListener('click', () => startScenario({ releaseHeightFactor: 0.95 }, true));
  el.h105.addEventListener('click', () => startScenario({ releaseHeightFactor: 1.05 }, true));
  el.pause.addEventListener('click', () => {
    running = !running;
    el.pause.textContent = running ? '暂停' : '继续';
    lastTs = null;
  });
  el.reset.addEventListener('click', () => startScenario({}, false));
  el.sound.addEventListener('click', () => {
    const on = el.sound.classList.toggle('sound-on');
    el.sound.textContent = on ? '声音开' : '声音关';
    audio.setEnabled(on);
    if (on) audio.unlock();
  });

  // —— 启动 ——
  startScenario({}, false);
  requestAnimationFrame(frame);

  // 调试/无头演示钩子:后台标签节流时可确定性快进
  window.__RG = {
    get world() { return world; },
    stepN(n) { for (let i = 0; i < n; i++) world.step(); renderer.draw(); },
    draw() { renderer.draw(); },
    release() { world.actions.release(); },
  };
})();
</script>
</body>
